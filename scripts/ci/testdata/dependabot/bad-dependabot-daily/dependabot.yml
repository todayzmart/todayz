version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: gomod
    directories: ["/backend", "/backend/tools", "/e2e/mocks", "/scripts/envtool", "/scripts/ci/wflint"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
