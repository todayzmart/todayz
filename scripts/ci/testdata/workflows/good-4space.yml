# Must pass wflint: four-space indentation parses the same as two.
name: good-4space
on:
    pull_request:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
defaults:
    run:
        shell: bash
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   run: make check
