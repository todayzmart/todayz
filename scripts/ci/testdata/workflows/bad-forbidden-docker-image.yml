name: x
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
jobs:
  a:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: docker run --rm hashicorp/terraform:latest -chdir=infra/terraform apply -auto-approve
defaults:
  run:
    shell: bash
