name: fixture
on:
  pull_request:
permissions:
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: make check
