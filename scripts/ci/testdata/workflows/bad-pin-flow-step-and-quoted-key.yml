name: t
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
jobs:
  a:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - { uses: actions/checkout@v4 }
      - "uses": actions/setup-node@v4
defaults:
  run:
    shell: bash
