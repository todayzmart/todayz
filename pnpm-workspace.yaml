# pnpm workspace (W0-01). Apps consume shared/* through workspace:*.
# Each app must still build on its own so it can become its own repo later.
packages:
  - "shared/*"
  - "customer"
  - "business"
  - "admin"
  - "site"
  - "e2e"
  - "e2e/*"

# pnpm 10 skips dependency build scripts unless listed here (W0-05).
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
