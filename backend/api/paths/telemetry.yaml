# Paths: domain "telemetry" (owner W1-07): RUM, product events and the slow test routes (04 §2.9, D-93).
# `/v1/client-errors` is not built: errors travel in the RUM batch (05 §2.4), so the endpoint is not needed
# while the RUM route exists.
/v1/rum:
  post:
    operationId: postRum
    tags: [telemetry]
    summary: Send a batch of browser performance samples and errors
    description: |
      Called by `@todayz/telemetry` with `sendBeacon`. Anonymous. The samples become the `tz_rum_*`
      histograms (route cardinality is capped per app); errors are logged with a fingerprint, app and
      app version; 1% of the samples are also kept as raw log lines. Answers 204 with no body.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/telemetry.yaml#/RumBatch
          example:
            app: customer
            release: customer@3f2a9c1
            platform: web
            conn: 4g
            samples:
              - { type: vital, name: LCP, value: 1820.5, route: /search, detail: { rating: good }, t: 1792660000000 }
              - { type: error, name: TypeError, route: /r/$token, detail: { message: "Cannot read properties of undefined" }, t: 1792660001000 }
    responses:
      "204":
        description: Accepted
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/events:
  post:
    operationId: postEvents
    tags: [telemetry]
    summary: Send a batch of client product events
    description: |
      Up to 50 events per call, anonymous (the signed-in user is added when the request has one). Each event's
      name and props are checked against the catalogue in `shared/telemetry/events/<domain>.yaml`. An event that
      is unknown, server-emitted, has invalid props, is outside the time window or repeats an id is dropped and
      counted in `tz_events_dropped_total{reason}`; the call still succeeds and the body says how many were
      stored and dropped. Only a malformed envelope (bad JSON, more than 50 events, a missing required field)
      is an error. Retrying a batch is safe: an event id that is already stored is skipped.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/telemetry.yaml#/EventBatch
          example:
            app: customer
            appVersion: 3f2a9c1
            platform: web
            anonId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
            sessionId: 01JB0S1W6W8ZV7T1C3A6M9N4PR
            events:
              - id: 01JB0S1W6W8ZV7T1C3A6M9N4PS
                name: app_opened
                t: "2026-10-22T09:30:00Z"
                props: { launch: cold }
    responses:
      "202":
        description: Stored
        content:
          application/json:
            schema:
              $ref: ../schemas/telemetry.yaml#/EventsAccepted
            example:
              accepted: 1
              dropped: 0
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/test/slow:
  get:
    operationId: getTestSlow
    tags: [telemetry]
    summary: Answer after a delay
    description: |
      Forces a slow route for the latency alerts and the slow-network checks (D-93). Registered only when
      `APP_ENV` is `local` or `test`, the database agrees and `API_ADDR` is a loopback address (the same gate
      as `/v1/test/clock`); otherwise 404.
    security: []
    parameters:
      - name: ms
        in: query
        required: true
        description: Milliseconds to wait, 0 to 30000.
        schema:
          type: integer
          minimum: 0
          maximum: 30000
        example: 5
    responses:
      "200":
        description: Waited
        content:
          application/json:
            schema:
              $ref: ../schemas/telemetry.yaml#/SlowTestResult
            example:
              sleptMs: 5
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/test/slow-sql:
  get:
    operationId: getTestSlowSql
    tags: [telemetry]
    summary: Answer after a slow query
    description: |
      Runs `pg_sleep(ms / 1000)` in a query, to force a slow query for the slow-query alert (D-93). Same
      gate as `/v1/test/clock`; otherwise 404.
    security: []
    parameters:
      - name: ms
        in: query
        required: true
        description: Milliseconds the query sleeps, 0 to 30000.
        schema:
          type: integer
          minimum: 0
          maximum: 30000
        example: 5
    responses:
      "200":
        description: The query returned
        content:
          application/json:
            schema:
              $ref: ../schemas/telemetry.yaml#/SlowTestResult
            example:
              sleptMs: 5
      default:
        $ref: ../common/responses.yaml#/Problem
