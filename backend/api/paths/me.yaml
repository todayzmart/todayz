# Paths: domain "me" (owner W1-01, W2-05, W2-04): the signed-in user's profile, addresses, stream, notifications (04 §2.2).
#
# Pre-created empty by W0-04 so parallel work packages never edit the same file
# (D-50). Fill it as a map of path -> path item. Every operation: `tags: [me]`,
# an operationId unique across the API, an example per request and success
# response, and `default: {$ref: ../common/responses.yaml#/Problem}`. Reference
# this domain's schemas as `../schemas/me.yaml#/Name` and the shared ones as
# `../schemas/common.yaml#/Name`; parameters and headers from `../common/`.
# Mark idempotent operations `x-idempotency: required|optional` and uploads
# `x-upload: true` (04 §1.6; the server reads the route policy from the spec).
# List the domain problem codes an operation can return under `x-problems`.
/v1/me:
  get:
    operationId: getMe
    tags: [me]
    summary: The signed-in user
    description: Any app. For a customer also the referral code and the active-order limit from no-show strikes (C-21).
    x-problems: [account_blocked]
    responses:
      "200":
        description: The user
        headers:
          ETag:
            $ref: ../common/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../schemas/me.yaml#/Me
            example:
              id: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
              name: Asha
              preferredLang: en
              phoneMasked: 90•••••001
              app: customer
              customer:
                referralCode: K7M2QX
                activeOrderLimit: null
              createdAt: "2026-10-22T09:30:00Z"
      default:
        $ref: ../common/responses.yaml#/Problem
  patch:
    operationId: updateMe
    tags: [me]
    summary: Change name or language
    x-idempotency: none
    x-problems: [account_blocked]
    parameters:
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/me.yaml#/MePatch
          example:
            name: Asha
            preferredLang: kn
    responses:
      "200":
        description: The user after the change
        headers:
          ETag:
            $ref: ../common/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../schemas/me.yaml#/Me
            example:
              id: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
              name: Asha
              preferredLang: kn
              phoneMasked: 90•••••001
              app: customer
              customer:
                referralCode: K7M2QX
                activeOrderLimit: null
              createdAt: "2026-10-22T09:30:00Z"
      default:
        $ref: ../common/responses.yaml#/Problem
  delete:
    operationId: deleteMe
    tags: [me]
    summary: Delete my account
    description: |
      Customer app only (D-31). Confirm with a fresh SMS code: `POST /v1/auth/otp/send` with
      `purpose: step_up` and `app: customer` for the account's own number, then send its
      `requestId` and code here. A wrong code is `422 code_invalid` with
      `extensions.attemptsLeft` (5 tries, then `429 otp_locked`); an expired, used or foreign code
      is `401 otp_expired`. Every domain's check runs first; a refusal (`409
      account_has_active_order` while an order is not finished, D-31; `409 conflict` while no-show
      strikes limit the account, with `extensions.limitedUntil`, D-106) changes nothing, leaves the
      code unused and does not count as one of its 5 tries. Otherwise, in one transaction: every domain's deletion hook runs (the
      wallet is forfeited, asks are deleted, D-101), the account is anonymised (name and phone
      removed; orders and ledger rows keep only the id), saved addresses and push endpoints are
      deleted, and every session in every app is revoked. The number can sign up again as a new
      account.
    x-idempotency: none
    x-problems: [otp_locked, otp_expired, code_invalid, account_blocked]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/me.yaml#/MeDeleteRequest
          example:
            otpRequestId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
            code: "123456"
    responses:
      "204":
        description: The account is deleted and signed out everywhere
        headers:
          Set-Cookie:
            description: Clears the customer refresh cookie (`Max-Age=0`).
            schema:
              type: string
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/me/addresses:
  get:
    operationId: listMyAddresses
    tags: [me]
    summary: My saved addresses (C-18, C-11)
    description: Customer app only. The default address first, then the newest change first. Another user's addresses never appear.
    responses:
      "200":
        description: The caller's saved addresses
        content:
          application/json:
            schema:
              $ref: ../schemas/me.yaml#/AddressList
            example:
              addresses:
                - addressId: 01JB0SA1D2D3R4E5S6S7H8Q9M0
                  label: Home
                  line1: 12, 4th Cross, Indiranagar
                  line2: null
                  landmark: Near the park
                  pincode: "560038"
                  lat: 12.9719
                  lng: 77.6412
                  isDefault: true
                  updatedAt: "2026-10-24T09:30:00Z"
                  version: 1
      default:
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: createAddress
    tags: [me]
    summary: Save a new address
    description: >-
      Customer app only. The pin (`lat`, `lng`) is what the delivery radius is checked against
      (01 §5.5). The first address is the default; `isDefault: true` makes this one the default
      and clears the others. `422 validation_failed` on the field (`body.pincode` must be 6
      digits not starting with 0) or on `body` when the caller already keeps the most addresses
      allowed (20).
    x-idempotency: optional
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/me.yaml#/AddressCreate
          example:
            label: Home
            line1: 12, 4th Cross, Indiranagar
            landmark: Near the park
            pincode: "560038"
            lat: 12.9719
            lng: 77.6412
    responses:
      "201":
        description: The address
        headers:
          ETag:
            $ref: ../common/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../schemas/me.yaml#/Address
            example:
              addressId: 01JB0SA1D2D3R4E5S6S7H8Q9M0
              label: Home
              line1: 12, 4th Cross, Indiranagar
              line2: null
              landmark: Near the park
              pincode: "560038"
              lat: 12.9719
              lng: 77.6412
              isDefault: true
              updatedAt: "2026-10-24T09:30:00Z"
              version: 1
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/me/addresses/{addressId}:
  parameters:
    - name: addressId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  patch:
    operationId: updateAddress
    tags: [me]
    summary: Change a saved address
    description: >-
      Customer app only. `If-Match` is required (428 without it, 412 when stale). Another user's
      address is 404. `isDefault: true` makes it the default and clears the others;
      `isDefault: false` is refused on the default address (`422 validation_failed` on
      `body.isDefault`: make another one the default instead). Orders already placed keep the
      address they were placed with.
    x-idempotency: none
    parameters:
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/me.yaml#/AddressPatch
          example:
            landmark: Opposite the temple
    responses:
      "200":
        description: The address after the change
        headers:
          ETag:
            $ref: ../common/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../schemas/me.yaml#/Address
            example:
              addressId: 01JB0SA1D2D3R4E5S6S7H8Q9M0
              label: Home
              line1: 12, 4th Cross, Indiranagar
              line2: null
              landmark: Opposite the temple
              pincode: "560038"
              lat: 12.9719
              lng: 77.6412
              isDefault: true
              updatedAt: "2026-10-24T10:00:00Z"
              version: 2
      default:
        $ref: ../common/responses.yaml#/Problem
  delete:
    operationId: deleteAddress
    tags: [me]
    summary: Delete a saved address
    description: >-
      Customer app only. Another user's address is 404. Deleting the default makes the most
      recently changed remaining address the default. Orders already placed keep their own copy
      of the address.
    x-idempotency: none
    responses:
      "204":
        description: Deleted
      default:
        $ref: ../common/responses.yaml#/Problem
