/v1/admin/stores/{storeId}/force-close:
  parameters:
    - name: storeId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: forceCloseAdminStore
    tags: [admin-stores]
    summary: Close a store until a time (audited)
    description: >-
      With a reason. The store shows closed and takes no orders until `until`, which must be in the future. Open orders are not cancelled.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-stores.yaml#/AdminStoreForceClose
          example:
