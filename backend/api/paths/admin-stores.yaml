# Paths: domain "admin-stores" (owner W3-05): A-05 Stores (04 §2.7, D-40, D-41).
#
# `support` lists, opens and resets a store's strikes; `admin` and `super_admin` review a new store,
# move its pin or hours and force-close it. Every change is audited with its reason. Roles per
# operation are in internal/platform/authz/policy/admin.go.
/v1/admin/stores:
  get:
    operationId: listAdminStores
    tags: [admin-stores]
    summary: Stores, newest first
    description: >-
      `status` narrows to one store status (`pending_review` is the Review tab); `city` is an exact,
      case-insensitive match.
    parameters:
      - name: status
        in: query
        schema:
          $ref: ../schemas/admin-stores.yaml#/AdminStoreStatus
      - name: city
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: Stores
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-stores.yaml#/AdminStoreList
            example:
              items:
                - id: 01JB0SST1A2B3C4D5E6F7G8H9J
                  name: Annapurna Kirana
                  businessId: 01JB0SBZ1A2B3C4D5E6F7G8H9J
                  businessName: Annapurna Kirana
                  businessStatus: verified
                  status: pending_review
                  locality: Jayanagar
                  city: Bengaluru
                  closedUntil: null
                  activeStrikes: 0
                  reliabilityScore: null
                  createdAt: "2026-10-18T09:00:00Z"
              nextCursor: null
              serverNow: "2026-10-24T11:00:00Z"
      default: &problem
        $ref: ../common/responses.yaml#/Problem
/v1/admin/stores/{storeId}:
  parameters:
    - name: storeId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getAdminStore
    tags: [admin-stores]
    summary: One store with address, hours, reliability and strikes
    responses:
      "200":
        description: The store
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-stores.yaml#/AdminStore
            example:
              id: 01JB0SST1A2B3C4D5E6F7G8H9J
              name: Annapurna Kirana
              businessId: 01JB0SBZ1A2B3C4D5E6F7G8H9J
              businessName: Annapurna Kirana
              businessStatus: verified
              status: live
              addressLine1: 12, 4th Cross
              addressLine2: null
              landmark: Near the temple
              locality: Jayanagar
              city: Bengaluru
              pincode: "560041"
              location:
                lat: 12.925
                lng: 77.583
              hours:
                weekly:
                  mon: [{open: "09:00", close: "21:00"}]
                holidays: []
              closedUntil: null
              reviewNote: null
              liveAt: "2026-10-20T10:00:00Z"
              reviewedAt: "2026-10-20T10:00:00Z"
              ratingAvg: 4.4
              ratingCount: 38
              acceptRate30d: 0.96
              unacceptedExpiryRate30d: 0.02
              reliabilityScore: 0.91
              reliabilityComputedAt: "2026-10-24T02:00:00Z"
              activeStrikes: 1
              strikes: []
              createdAt: "2026-10-18T09:00:00Z"
              serverNow: "2026-10-24T11:00:00Z"
      default: *problem
  patch:
    operationId: updateAdminStore
    tags: [admin-stores]
    summary: Move a store's pin or change its hours (audited)
    description: >-
      With a reason. Hours follow the business app's rules (at most 4 ranges a day, not overlapping);
      a broken rule is `422 validation_failed` naming the field.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-stores.yaml#/AdminStoreUpdate
          example:
            reason: Owner called; the pin was on the next street
            location:
              lat: 12.925
              lng: 77.583
    responses:
      "200":
        description: The store after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-stores.yaml#/AdminStore
            example:
              id: 01JB0SST1A2B3C4D5E6F7G8H9J
              name: Annapurna Kirana
              businessId: 01JB0SBZ1A2B3C4D5E6F7G8H9J
              businessName: Annapurna Kirana
              businessStatus: verified
              status: live
              addressLine1: 12, 4th Cross
              addressLine2: null
              landmark: Near the temple
              locality: Jayanagar
              city: Bengaluru
              pincode: "560041"
              location:
                lat: 12.925
                lng: 77.583
              hours:
                weekly:
                  mon: [{open: "09:00", close: "21:00"}]
                holidays: []
              closedUntil: null
              reviewNote: null
              liveAt: "2026-10-20T10:00:00Z"
              reviewedAt: "2026-10-20T10:00:00Z"
              ratingAvg: 4.4
              ratingCount: 38
              acceptRate30d: 0.96
              unacceptedExpiryRate30d: 0.02
              reliabilityScore: 0.91
              reliabilityComputedAt: "2026-10-24T02:00:00Z"
              activeStrikes: 1
