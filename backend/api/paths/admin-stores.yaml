/v1/admin/stores/{storeId}/strikes/reset:
  parameters:
    - name: storeId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: resetAdminStoreStrikes
    tags: [admin-stores]
    summary: Reset a store's strikes (audited)
    description: >-
      Marks every strike not yet reset as reset, with the reason and the admin (D-41). The reliability job recounts them on its next run. No strike to reset is `409 invalid_transition`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-stores.yaml#/AdminStoreChange
          example:
            reason: The dispatch timeouts were a rider outage
    responses:
      "200":
        description: The store after the change
        content:
