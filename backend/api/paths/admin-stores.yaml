/v1/admin/stores/{storeId}/review:
  parameters:
    - name: storeId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: reviewAdminStore
    tags: [admin-stores]
    summary: Approve a new store or send it back (audited)
    description: >-
      From `pending_review` (D-40). Approve makes the store `live`, and needs its business `verified` (a first store goes live with the business on A-03). Send back returns it to `draft` with a note for the owner. Any other status, or approving at a business that is not verified, is `409 invalid_transition`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-stores.yaml#/AdminStoreReviewRequest
          example:
            decision: approve
    responses:
      "200":
        description: The store after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-stores.yaml#/AdminStore
            example:
              id: 01JB0SST1A2B3C4D5E6F7G8H9J
              name: Annapurna Kirana
              businessId: 01JB0SBZ1A2B3C4D5E6F7G8H9J
              businessName: Annapurna Kirana
              businessStatus: verified
              status: live
              addressLine1: 12, 4th Cross
