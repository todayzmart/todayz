# Paths: domain "support" (owner W3-08): the customer's own support tickets (01 §13, 04 §2.6, 06 C-19, D-226).
#
# The signed-in customer (action me.support.tickets, internal/platform/authz/policy/support.go).
# Only tickets the caller opened as a customer appear; anyone else's, or a business ticket,
# is 404. Internal notes never appear here. The business side is biz-support.yaml.
/v1/me/support/tickets:
  get:
    operationId: listMyTickets
    tags: [support]
    summary: My tickets, latest activity first (C-19)
    parameters:
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: Tickets
        content:
          application/json:
            schema:
              $ref: ../schemas/support.yaml#/MyTicketList
            example:
              items:
                - &ticket
                  id: 01JB0SKC1A2B3C4D5E6F7G8H9J
                  number: SUP-001043
                  subject: Item missing from my order
                  category: order
                  status: waiting
                  storeName: Annapurna Kirana, Koramangala
                  orderId: 01JB0SRD1A2B3C4D5E6F7G8H9J
                  orderNumber: TZ-4821
                  lastMessageAt: "2026-10-24T10:30:00Z"
                  createdAt: "2026-10-24T09:30:00Z"
              nextCursor: null
      default: &problem
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: createMyTicket
    tags: [support]
    summary: Open a ticket (C-19)
    description: >-
      Starts `open` at normal priority, due `support_sla_normal_min` minutes from now. `orderId` must be
      one of the caller's own orders (`422 validation_failed` otherwise). `attachmentIds` are the
      caller's own customer uploads that no message holds yet.
      One person may have at most `support_open_tickets_max` tickets open or waiting at once
      (`422 support_ticket_limit_reached`) and open at most `support_tickets_per_hour` in a rolling hour
      (`429 rate_limited`).
    x-idempotency: required
    x-problems: [support_ticket_limit_reached, rate_limited]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/support.yaml#/MyTicketCreate
          example:
            category: order
            subject: Item missing from my order
            body: The atta was not in the bag when I picked up the order.
            orderId: 01JB0SRD1A2B3C4D5E6F7G8H9J
            attachmentIds: [01JB0SAC1A2B3C4D5E6F7G8H9J]
    responses:
      "201":
        description: The ticket and its first message
        content:
          application/json:
            schema:
              $ref: ../schemas/support.yaml#/MyTicketThread
            example:
              ticket:
                <<: *ticket
                status: open
                lastMessageAt: "2026-10-24T09:30:00Z"
              messages:
                - id: 01JB0SMC1A2B3C4D5E6F7G8H9J
                  from: customer
                  body: The atta was not in the bag when I picked up the order.
                  createdAt: "2026-10-24T09:30:00Z"
                  attachments:
                    - id: 01JB0SAC1A2B3C4D5E6F7G8H9J
                      fileName: bill.jpg
                      contentType: image/jpeg
                      sizeBytes: 182113
                      url: https://s3.todayz.localhost/private/support/01JB0SAC1A2B3C4D5E6F7G8H9J?X-Amz-Algorithm=AWS4-HMAC-SHA256
              serverNow: "2026-10-24T09:30:00Z"
      default: *problem
/v1/me/support/tickets/{ticketId}/messages:
  parameters:
    - name: ticketId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getMyTicketThread
    tags: [support]
    summary: A ticket and its messages (C-19)
    description: Oldest first, internal notes left out. Attachments carry presigned GETs valid for 15 minutes.
    responses:
      "200":
        description: The thread
        content:
          application/json:
            schema:
              $ref: ../schemas/support.yaml#/MyTicketThread
            example: &thread
              ticket: *ticket
              messages:
                - id: 01JB0SMC1A2B3C4D5E6F7G8H9J
                  from: customer
                  body: The atta was not in the bag when I picked up the order.
                  createdAt: "2026-10-24T09:30:00Z"
                  attachments: []
                - id: 01JB0SMD1A2B3C4D5E6F7G8H9J
                  from: support
                  body: Sorry about that. We have asked the shop and will refund the atta to your credits.
                  createdAt: "2026-10-24T10:30:00Z"
                  attachments: []
              serverNow: "2026-10-24T11:00:00Z"
      default: *problem
  post:
    operationId: postMyTicketMessage
    tags: [support]
    summary: Reply on a ticket (C-19)
    description: >-
      A reply on a `waiting` or `resolved` ticket reopens it (`open`, due again from the
      priority's `support_sla_*_min`). A `closed` ticket is `409 invalid_transition`: open a new one.
    x-idempotency: required
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/support.yaml#/MyTicketMessageCreate
          example:
            body: Thank you, I can see the credits now.
            attachmentIds: []
    responses:
      "201":
        description: The thread after the reply
        content:
          application/json:
            schema:
              $ref: ../schemas/support.yaml#/MyTicketThread
            example: *thread
      default: *problem
/v1/me/support/attachments:
  post:
    operationId: createMyTicketAttachment
    tags: [support]
    summary: Get an upload URL for an attachment (C-19)
    description: >-
      Records the attachment and returns a presigned PUT into the private bucket, valid for 15 minutes.
      The URL signs the Content-Type and the size, so the PUT sends exactly the returned headers. Send its
      id with the new ticket or the next reply. JPEG, PNG, WebP or PDF, at most 10 MB. At most
      `support_uploads_per_hour` uploads per person in a rolling hour (`429 rate_limited`); an upload no
      message claims within `support_upload_ttl_hours` is refused and deleted. On claim the object must
      exist with the declared size and type (`422 validation_failed` otherwise).
      `503 service_unavailable` while storage is not configured.
    x-idempotency: none
    x-problems: [rate_limited]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/support.yaml#/MyTicketAttachmentCreate
          example:
            fileName: bill.jpg
            contentType: image/jpeg
            sizeBytes: 182113
    responses:
      "201":
        description: The attachment and where to upload it
        headers:
          Cache-Control:
            description: "`no-store`: the upload URL is a credential."
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/support.yaml#/MyTicketAttachmentUpload
            example:
              attachment:
                id: 01JB0SAC1A2B3C4D5E6F7G8H9J
                fileName: bill.jpg
                contentType: image/jpeg
                sizeBytes: 182113
                url: null
              upload:
                url: https://s3.todayz.localhost/private/support/01JB0SAC1A2B3C4D5E6F7G8H9J?X-Amz-Algorithm=AWS4-HMAC-SHA256
                method: PUT
                headers:
                  Content-Type: image/jpeg
                  Content-Length: "182113"
                expiresAt: "2026-10-24T09:45:00Z"
      default: *problem
