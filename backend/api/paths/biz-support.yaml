# Paths: domain "biz-support" (owner W3-08): a business's own support tickets (01 §13, 04 §2.6, 06 B-15, D-226).
#
# Owner and manager (action support.tickets, internal/platform/authz/policy/support.go); a cashier is
# 403. A manager sees every ticket of the business. Another business's ticket is 404. Internal notes
# never appear here.
/v1/biz/businesses/{bid}/support/tickets:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: listBizTickets
    tags: [biz-support]
    summary: The business's tickets, latest activity first
    parameters:
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: Tickets
        content:
          application/json:
            schema:
              $ref: ../schemas/biz-support.yaml#/BizTicketList
            example:
              items:
                - &ticket
                  id: 01JB0SKT1A2B3C4D5E6F7G8H9J
                  number: SUP-001042
                  subject: Payout for September not received
                  category: payouts
                  status: waiting
                  storeId: 01JB0SST1A2B3C4D5E6F7G8H9J
                  storeName: Annapurna Kirana, Koramangala
                  orderId: null
                  orderNumber: null
                  lastMessageAt: "2026-10-24T10:30:00Z"
                  createdAt: "2026-10-24T09:30:00Z"
              nextCursor: null
      default: &problem
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: createBizTicket
    tags: [biz-support]
    summary: Open a ticket
    description: >-
      Starts `open` at normal priority, due `support_sla_normal_min` minutes from now. `storeId` and
      `orderId` must belong to this business (`422 validation_failed` otherwise). `attachmentIds` are
      the caller's own uploads for this business that no message holds yet.
      One person may have at most `support_open_tickets_max` tickets open or waiting at once
      (`422 support_ticket_limit_reached`) and open at most `support_tickets_per_hour` in a rolling hour
      (`429 rate_limited`).
    x-idempotency: required
    x-problems: [support_ticket_limit_reached, rate_limited]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/biz-support.yaml#/BizTicketCreate
          example:
            category: payouts
            subject: Payout for September not received
            body: The September statement says paid but nothing reached my bank.
            storeId: 01JB0SST1A2B3C4D5E6F7G8H9J
            attachmentIds: [01JB0SAT1A2B3C4D5E6F7G8H9J]
    responses:
      "201":
        description: The ticket and its first message
        content:
          application/json:
            schema:
              $ref: ../schemas/biz-support.yaml#/BizTicketThread
            example:
              ticket:
                id: 01JB0SKT1A2B3C4D5E6F7G8H9J
                number: SUP-001042
                subject: Payout for September not received
                category: payouts
                status: open
                storeId: 01JB0SST1A2B3C4D5E6F7G8H9J
                storeName: Annapurna Kirana, Koramangala
                orderId: null
                orderNumber: null
                lastMessageAt: "2026-10-24T09:30:00Z"
                createdAt: "2026-10-24T09:30:00Z"
              messages:
                - id: 01JB0SMS1A2B3C4D5E6F7G8H9J
                  from: business
                  authorName: Ravi Sharma
                  body: The September statement says paid but nothing reached my bank.
                  createdAt: "2026-10-24T09:30:00Z"
                  attachments:
                    - id: 01JB0SAT1A2B3C4D5E6F7G8H9J
                      fileName: bank-statement.pdf
                      contentType: application/pdf
                      sizeBytes: 182113
                      url: https://s3.todayz.localhost/private/support/01JB0SAT1A2B3C4D5E6F7G8H9J?X-Amz-Algorithm=AWS4-HMAC-SHA256
              serverNow: "2026-10-24T09:30:00Z"
      default: *problem
/v1/biz/businesses/{bid}/support/tickets/{ticketId}/messages:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: ticketId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getBizTicketThread
    tags: [biz-support]
    summary: A ticket and its messages
    description: Oldest first, internal notes left out. Attachments carry presigned GETs valid for 15 minutes.
    responses:
      "200":
        description: The thread
        content:
          application/json:
            schema:
              $ref: ../schemas/biz-support.yaml#/BizTicketThread
            example: &thread
              ticket: *ticket
              messages:
                - id: 01JB0SMS1A2B3C4D5E6F7G8H9J
                  from: business
                  authorName: Ravi Sharma
                  body: The September statement says paid but nothing reached my bank.
                  createdAt: "2026-10-24T09:30:00Z"
                  attachments: []
                - id: 01JB0SMT1A2B3C4D5E6F7G8H9J
                  from: support
                  authorName: null
                  body: We have raised it with the bank. You will hear from us within two working days.
                  createdAt: "2026-10-24T10:30:00Z"
                  attachments: []
              serverNow: "2026-10-24T11:00:00Z"
      default: *problem
  post:
    operationId: postBizTicketMessage
    tags: [biz-support]
    summary: Reply on a ticket
    description: >-
      A reply on a `waiting` or `resolved` ticket reopens it (`open`, due again from the
      priority's `support_sla_*_min`). A `closed` ticket is `409 invalid_transition`: open a new one.
    x-idempotency: required
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/biz-support.yaml#/BizTicketMessageCreate
          example:
            body: Thank you, the money has arrived.
            attachmentIds: []
    responses:
      "201":
        description: The thread after the reply
        content:
          application/json:
            schema:
              $ref: ../schemas/biz-support.yaml#/BizTicketThread
            example: *thread
      default: *problem
/v1/biz/businesses/{bid}/support/attachments:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: createBizTicketAttachment
    tags: [biz-support]
    summary: Get an upload URL for an attachment
    description: >-
      Records the attachment and returns a presigned PUT into the private bucket, valid for 15 minutes.
      The URL signs the Content-Type and the size, so the PUT sends exactly the returned headers. Send its
      id with the new ticket or the next reply. JPEG, PNG, WebP or PDF, at most 10 MB. At most
      `support_uploads_per_hour` uploads per person in a rolling hour (`429 rate_limited`); an upload no
      message claims within `support_upload_ttl_hours` is refused and deleted. On claim the object must
      exist with the declared size and type (`422 validation_failed` otherwise).
      `503 service_unavailable` while storage is not configured.
    x-idempotency: none
    x-problems: [rate_limited]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/biz-support.yaml#/BizAttachmentCreate
          example:
            fileName: bank-statement.pdf
            contentType: application/pdf
            sizeBytes: 182113
    responses:
      "201":
        description: The attachment and where to upload it
        headers:
          Cache-Control:
            description: "`no-store`: the upload URL is a credential."
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/biz-support.yaml#/BizAttachmentUpload
            example:
              attachment:
                id: 01JB0SAT1A2B3C4D5E6F7G8H9J
                fileName: bank-statement.pdf
                contentType: application/pdf
                sizeBytes: 182113
                url: null
              upload:
                url: https://s3.todayz.localhost/private/support/01JB0SAT1A2B3C4D5E6F7G8H9J?X-Amz-Algorithm=AWS4-HMAC-SHA256
                method: PUT
                headers:
                  Content-Type: application/pdf
                  Content-Length: "182113"
                expiresAt: "2026-10-24T09:45:00Z"
      default: *problem
