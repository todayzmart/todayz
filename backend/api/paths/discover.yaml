/v1/discover/stores/{slug}/substitutes:
  parameters:
  - name: slug
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Slug
  get:
    operationId: listDiscoverSubstitutes
    tags:
    - discover
    summary: Alternatives to a shop's item
    description: 'AI-C3 substitutes, rule-based (11 §AI-C3, D-233; no model, no flag): what to buy
      instead of `itemId` when it is out of stock. `sameShop`: in-stock items of this shop in the same
      category, of a pack size within 25% of it in the same kind of unit, same brand first, then the
      closest pack, then price. `nearby`: the same master product in stock at other live shops of
      verified businesses inside the radius, nearest first. A store that is not live, or an item it
      does not list, is 404 `not_found`. Read-only and not logged as a search.'
    security: []
    parameters:
    - name: itemId
      in: query
      required: true
