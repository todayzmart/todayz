/v1/discover/search:
  get:
    operationId: searchDiscover
    tags:
    - discover
    summary: Search items in shops nearby
    description: 'Results grouped by store (C-05, 01 §11). Filters first (in stock, a live store of a
      verified business, inside the radius, then the request''s filters), then the score with weights
      from `search_w_*`; equal scores go to the nearer store. `sort=nearest` orders by distance and `sort=cheapest`
      by the cheapest matching item. D-101: `summary` (absent when no store has it), `confirmedAt` per
      item, at most one `badge` per store on the first page, and `deliveryFeePaise`. Unless `parse=false`,
      the deterministic refine-chip parser (no model) reads price caps, open now, pickup, delivery, offers,
      near me and brands out of `q`; each chip it applies is a filter, is listed in `chips`, and `query` is
      what is left to search for. A chip whose filter the request sets itself is not applied. `refineHint`
      is true when parsing was on, no chip was read and `q` has at least `refine_ai_min_words` words. Every search
      is logged to `search_log`, zero results too. Search never calls a model.'
    security: []
    parameters:
    - name: q
      in: query
      required: true
      description: The search text.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: amul butter
    - *id002
    - *id003
    - *id004
    - *id007
    - *id010
    - *id011
    - *id012
    - name: brand
      in: query
      description: A brand slug.
      schema: *id013
    - name: productId
      in: query
      description: Only listings of this master product (a ULID, `DiscoverSearchItem.productId`), with
        the same filters as the rest (live stores of verified businesses inside the radius, in stock).
        `q` is still required and still scores the results; send the product name. The product page uses
        it for "Other nearby shops". `summary` counts the filtered set.
      schema:
        $ref: ../schemas/common.yaml#/Ulid
      example: 01JB0S4A5B6C7D8E9F0G1H2J3K
    - name: maxPricePaise
      in: query
      description: Items priced at most this.
      schema:
        type: integer
        minimum: 1
        maximum: 100000000
    - *id014
    - name: sort
      in: query
      description: Result order.
      schema:
        type: string
        enum:
        - relevance
        - nearest
        - cheapest
        default: relevance
    - name: parse
      in: query
      description: Run the refine-chip parser on `q` (D-101). The app sends false after the customer removes a chip.
      schema:
        type: boolean
        default: true
    - name: source
      in: query
      description: How the query was entered; recorded in `search_log` and the `search_performed` event.
      schema:
        type: string
        enum:
        - typed
        - voice
        default: typed
    - *id008
    - *id009
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/discover.yaml#/DiscoverSearchResult
            example:
              query: amul butter
              summary:
                storesChecked: 4
                storesWithIt: 1
                minPricePaise: 5800
              results:
              - store: *id015
                items:
                - *id016
                badge: lowest_price
                deliveryFeePaise: null
              chips: []
              refineHint: false
              nextCursor: null
              serverNow: '2026-10-24T05:30:00Z'
      default: *id001
/v1/discover/search/suggest:
  get:
    operationId: searchSuggest
    tags:
    - discover
    summary: Suggestions while typing
    description: Products, brands and categories whose names start with or are close to the text. Not
      logged.
    security: []
    parameters:
    - name: q
      in: query
      required: true
      description: What the person typed.
      schema:
        type: string
        minLength: 1
        maxLength: 80
      example: amu
    - name: limit
      in: query
      description: At most this many suggestions.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 8
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/discover.yaml#/DiscoverSuggestionList
            example:
              items:
              - kind: brand
                text: Amul
                productId: null
                brandSlug: amul
                categorySlug: null
              - kind: product
                text: Amul Butter 100 g
                productId: 01JB0S4A5B6C7D8E9F0G1H2J3K
                brandSlug: null
                categorySlug: null
      default: *id001
# W2-14 (D-110, D-111): basket search. POST only because the lines are a body;
# it changes nothing. Coordinates and radius as discover search takes them.
/v1/discover/basket-search:
  post:
    operationId: searchBasket
    tags:
    - discover
    summary: Find the shops nearby that have a whole basket
    description: 'Basket search (C-22, 01 §11.4). The filter of discover search (in stock, a live store
      of a verified business, inside the radius); a line is covered when the store lists the product
      (free text: the store''s top search match) with `available` at least the quantity. Ranked by
      every line covered, then lines covered, then the basket total (store prices and item offers;
      credits never count), then distance, then store id. At most `basket_results_max` results;
      `badge` is a label only. `split` appears only when no store covers every line and
      `basket_split_max_shops` is above 1. At most `basket_max_items` lines (`422 validation_failed` on
      `body.lines` beyond); exactly one of `productId` and `text` per line. Read-only, never calls a
      model; each line is logged as a search (`source: basket`). Rate-limited per IP like discover
      search.'
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/discover.yaml#/BasketSearchRequest
          example:
            lat: 12.9719
            lng: 77.6412
            radius: 2000
            lines:
            - productId: 01JB0S4A5B6C7D8E9F0G1H2J3K
              quantity: 2
            - text: amul butter
              quantity: 1
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/discover.yaml#/BasketSearchResult
            example:
              summary:
                storesChecked: 4
                storesWithAll: 1
              results:
              - storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
                storeSlug: fresh-mart-indiranagar
                storeName: Fresh Mart
                locality: Indiranagar
                distanceM: 650
                open: true
                bookable: true
                coveredCount: 2
                lineCount: 2
                totalPaise: 64800
                badge: has_everything
                covered:
                - lineIndex: 0
                  storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
                  productId: 01JB0S4A5B6C7D8E9F0G1H2J3K
                  name: Aashirvaad Atta
                  variant: Whole wheat
                  packSize: 5
                  unit: kg
                  pricePaise: 29500
                  mrpPaise: 31000
                  imageKey: null
                  quantity: 2
                  lineTotalPaise: 59000
                  confirmedAt: '2026-10-24T04:00:00Z'
                - lineIndex: 1
                  storeItemId: 01JB0SA2T3E4M5S6H7D8X9Y0Z1
                  productId: 01JB0S4B5C6D7E8F9G0H1J2K3M
                  name: Amul Butter
                  variant: null
                  packSize: 100
                  unit: g
                  pricePaise: 5800
                  mrpPaise: 6000
                  imageKey: null
                  quantity: 1
                  lineTotalPaise: 5800
                  confirmedAt: null
                missing: []
              split: null
              serverNow: '2026-10-24T05:30:00Z'
      default: *id001
