# Paths: domain "auth" (owner W1-01): sign-in, OTP, refresh, sign-out, admin step-up (04 §2.1).
#
# Phase A: OTP send and verify, refresh, logout. Phase B: logout-all. D-264: the
# admin SMS step-up, step-up/send and step-up/verify (bearer, admin app). D-275: the sign-in
# code may come from Firebase Auth instead (`OTP_PROVIDER`): config tells the app which, and
# firebase/verify swaps a Firebase ID token for the TodayZ session. Every operation: `tags: [auth]`, an
# operationId unique across the API, an example per request and success response,
# and `default: {$ref: ../common/responses.yaml#/Problem}`.
/v1/auth/otp/send:
  post:
    operationId: sendOtp
    tags: [auth]
    summary: Send a sign-in code by SMS
    description: |
      Checks Turnstile, then the limits (01 §2): resend after 30 s, at most 5 sends per number
      and 20 per IP an hour (`429 rate_limited` with `Retry-After`). The answer is the same for a
      known and an unknown number (AU-06). The code is never logged (D-15). While the sign-in code
      comes from Firebase (`GET /v1/auth/config` says `otpProvider: firebase`, D-275), a `login`
      code is `409 sign_in_method_changed` (the app reads the config again); `step_up` still sends.
    security: []
    x-problems: [sign_in_method_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/OtpSendRequest
          example:
            phone: "+919000000001"
            purpose: login
            app: customer
            turnstileToken: XXXX.DUMMY.TOKEN.XXXX
    responses:
      "200":
        description: A code was sent (or, for a number that cannot get one, nothing was; the answer is the same)
        headers:
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/OtpSendResponse
            example:
              requestId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
              resendAfter: 30
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/otp/verify:
  post:
    operationId: verifyOtp
    tags: [auth]
    summary: Sign in with the code
    description: |
      Five tries per code: a wrong code is `401 unauthorized` with `extensions.attemptsLeft`; the
      sixth try is `429 otp_locked` even with the right code (AU-02). A code older than 5 min, used,
      or unknown is `401 otp_expired`. A blocked account is `403 account_blocked`. On success the
      app's refresh cookie is set (D-14) and the account is created if new (`isNewUser`). An admin
      is signed in by the code alone (D-264); a † action later needs an SMS step-up
      (`POST /v1/auth/step-up/send`). A `step_up` code never signs in (`401 otp_expired`).
    security: []
    x-problems: [otp_locked, otp_expired, account_blocked]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/OtpVerifyRequest
          example:
            requestId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
            code: "000000"
            app: customer
            deviceId: 01JB0S1W6W8ZV7T1C3A6M9N4PR
    responses:
      "200":
        description: Signed in
        headers:
          Set-Cookie:
            description: The app's refresh cookie (`__Secure-tz_rt_c|b|a`), host-only, `Path=/v1/auth`, HttpOnly, Secure, SameSite=Strict.
            schema:
              type: string
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/OtpVerifyResponse
            example:
              accessToken: EXAMPLE.ACCESS.TOKEN
              tokenType: Bearer
              expiresAt: "2026-10-22T09:45:00Z"
              isNewUser: true
              userId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/config:
  get:
    operationId: getAuthConfig
    tags: [auth]
    summary: Which service sends the sign-in code
    description: |
      D-275. `otpProvider` is `sms` (TodayZ sends the code, `otp/send` and `otp/verify`) or
      `firebase` (Firebase Auth sends and checks the code in the page, then
      `POST /v1/auth/firebase/verify`). With `firebase` it carries the Firebase web config: these
      values are public (they are in every page that signs in), never a secret. The provider is
      a deploy setting (`OTP_PROVIDER`), so the app reads this each time it shows sign-in and
      again on `409 sign_in_method_changed`. The admin step-up, a customer's `step_up` code and
      the field owner code are always SMS.
    security: []
    responses:
      "200":
        description: The sign-in code provider
        headers:
          Cache-Control:
            description: Always `no-store`, so a changed provider is read at once.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/AuthConfigResponse
            example:
              otpProvider: firebase
              firebase:
                apiKey: AIzaSyEXAMPLE-public-web-key
                authDomain: todayz-in.firebaseapp.com
                projectId: todayz-in
                appId: "1:123456789012:web:0123456789abcdef"
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/firebase/verify:
  post:
    operationId: verifyFirebaseSignIn
    tags: [auth]
    summary: Sign in with a Firebase phone sign-in
    description: |
      D-275. After Firebase Auth has checked the SMS code in the page, the app sends the Firebase
      ID token here. The API checks it (Google's signature, this project's `aud` and `iss`, not
      expired, a phone sign-in with a phone number) and then signs in exactly as `otp/verify`
      does: same users, sessions, refresh cookie, roles and audit. The phone sign-in must be at
      most 5 minutes old and each one signs in once; an older or reused one is `401 otp_expired`
      (ask for a new code). A bad token is `401 unauthorized`. A blocked account is
      `403 account_blocked`; an admin-app sign-in of a number that is not an active admin is
      `403 forbidden`, and of a locked number `429 signin_locked` (D-264). While the provider is
      `sms` this is `409 sign_in_method_changed`. The token is never logged or stored.
    security: []
    x-problems: [otp_expired, account_blocked, signin_locked, sign_in_method_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/FirebaseVerifyRequest
          example:
            idToken: EXAMPLE.FIREBASE.ID.TOKEN
            app: customer
            deviceId: 01JB0S1W6W8ZV7T1C3A6M9N4PR
    responses:
      "200":
        description: Signed in
        headers:
          Set-Cookie:
            description: The app's refresh cookie, as `otp/verify` sets it.
            schema:
              type: string
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/OtpVerifyResponse
            example:
              accessToken: EXAMPLE.ACCESS.TOKEN
              tokenType: Bearer
              expiresAt: "2026-10-22T09:45:00Z"
              isNewUser: false
              userId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/refresh:
  post:
    operationId: refreshSession
    tags: [auth]
    summary: Rotate the refresh token and get a new access token
    description: |
      Reads only the cookie of `app` (D-14). Every use rotates the token; presenting a token that
      was already rotated revokes the whole session family (AU-07). The request must come from the
      app's own origin (`Origin`) and carry `X-TZ-Client`, else `403 forbidden` (AU-16).
    security:
      - refreshCookieCustomer: []
      - refreshCookieBusiness: []
      - refreshCookieAdmin: []
    x-problems: [account_blocked]
    parameters:
      - name: X-TZ-Client
        in: header
        description: The app's client id and version (`customer/1.4.0`); required in practice (a request without it is `403 forbidden`, AU-16), optional in the schema so that refusal is a 403, not a 422.
        schema:
          type: string
          maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/AuthAppRequest
          example:
            app: customer
    responses:
      "200":
        description: Rotated
        headers:
          Set-Cookie:
            description: The rotated refresh cookie, same attributes as at sign-in.
            schema:
              type: string
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/AccessTokenResponse
            example:
              accessToken: EXAMPLE.ACCESS.TOKEN
              tokenType: Bearer
              expiresAt: "2026-10-22T09:45:00Z"
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/logout:
  post:
    operationId: logout
    tags: [auth]
    summary: Sign out this app on this device
    description: Revokes the session of `app`'s refresh cookie and clears the cookie. Same `Origin` and `X-TZ-Client` rule as refresh.
    security:
      - refreshCookieCustomer: []
      - refreshCookieBusiness: []
      - refreshCookieAdmin: []
    parameters:
      - name: X-TZ-Client
        in: header
        description: The app's client id and version (`customer/1.4.0`); required in practice (a request without it is `403 forbidden`, AU-16), optional in the schema so that refusal is a 403, not a 422.
        schema:
          type: string
          maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/AuthAppRequest
          example:
            app: customer
    responses:
      "204":
        description: Signed out
        headers:
          Set-Cookie:
            description: Clears the app's refresh cookie (`Max-Age=0`).
            schema:
              type: string
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/logout-all:
  post:
    operationId: logoutAll
    tags: [auth]
    summary: Sign out this app on every device
    description: |
      Revokes every session of `app` for the user of the app's refresh cookie, on every device, and
      clears the cookie. The user's sessions in the other apps stay signed in (AU-13). Same `Origin`
      and `X-TZ-Client` rule as refresh (AU-16). A missing, unknown, revoked or expired cookie is
      `401 unauthorized`.
    security:
      - refreshCookieCustomer: []
      - refreshCookieBusiness: []
      - refreshCookieAdmin: []
    parameters:
      - name: X-TZ-Client
        in: header
        description: The app's client id and version (`customer/1.4.0`); required in practice (a request without it is `403 forbidden`, AU-16), optional in the schema so that refusal is a 403, not a 422.
        schema:
          type: string
          maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/AuthAppRequest
          example:
            app: customer
    responses:
      "204":
        description: Every session of the app is signed out
        headers:
          Set-Cookie:
            description: Clears the app's refresh cookie (`Max-Age=0`).
            schema:
              type: string
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/step-up/send:
  post:
    operationId: sendStepUp
    tags: [auth]
    summary: Send the signed-in admin a step-up code by SMS
    description: |
      Admin app only (D-264). Sends a fresh 6-digit code to the admin's own number, the one they
      sign in with; the client never names a number. A † action (02 §3.3) needs a step-up younger
      than 10 minutes, else `403 step_up_required`. The code lives 5 minutes. The sign-in code's
      limits apply and count together with sign-in sends: resend after 30 s, at most 5 sends per
      number and 20 per IP an hour (`429 rate_limited` with `Retry-After`). The code and the
      number are never logged (D-15). Any other app is `403 forbidden`.
    responses:
      "200":
        description: A step-up code was sent
        headers:
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/OtpSendResponse
            example:
              requestId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
              resendAfter: 30
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/auth/step-up/verify:
  post:
    operationId: verifyStepUp
    tags: [auth]
    summary: Confirm a step-up code
    description: |
      Admin app only (D-264). The code must be one `step-up/send` sent to this admin, unused and
      younger than 5 minutes, else `401 otp_expired`. A wrong code is `422 code_invalid` with
      `extensions.attemptsLeft`; the fifth wrong code for one request ends every admin session of
      the admin and answers `429 otp_locked` (sign in again). A good code marks this sign-in as
      stepped up until `validUntil` (10 minutes); the access token and the refresh cookie stay as
      they are.
    x-problems: [otp_locked, otp_expired, code_invalid]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/StepUpVerifyRequest
          example:
            requestId: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
            code: "000000"
    responses:
      "200":
        description: Stepped up
        headers:
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/StepUpVerifyResponse
            example:
              validUntil: "2026-10-22T09:55:00Z"
      default:
        $ref: ../common/responses.yaml#/Problem
