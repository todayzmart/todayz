              $ref: ../schemas/business.yaml#/Store
            example:
              id: 01JB0S3M4N5P6Q7R8S9T0V1W2X
              businessId: 01JB0S2A3B4C5D6E7F8G9H0J1K
              slug: lakshmi-traders-indiranagar
              shortCode: Q4M7KX
              name: Lakshmi Traders Indiranagar
              addressLine1: 12, 100 Feet Road
              addressLine2: null
              landmark: null
              locality: Indiranagar
              city: Bengaluru
              pincode: "560038"
              location:
                lat: 12.9719
                lng: 77.6412
              phone: "+919000000020"
              hours:
                weekly:
                  mon: [{open: "22:00", close: "02:00"}]
                holidays: [{date: "2026-11-08", ranges: []}]
              status: live
              openNow: false
              createdAt: "2026-10-21T09:30:00Z"
      default:
