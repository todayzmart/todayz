              onHand: 10
              reserved: 2
              available: 8
              lowStockAt: null
              lowStock: false
              isListed: true
              stockUpdatedAt: "2026-10-23T05:00:00Z"
              stale: false
              createdAt: "2026-10-01T05:00:00Z"
              updatedAt: "2026-10-23T05:10:00Z"
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/items/{itemId}/movements:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: itemId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: createStockMovement
    tags: [catalogue]
    summary: Restock, count, damage or expire stock
    description: >-
      `count_correction` needs `stock.count` (cashier and above), `restock`
      needs `stock.restock`, `damage` and `expired` need `stock.damage`
      (manager and above, D-06). Negative movements use up batches by 03 stock
      rule 8 (D-99). `damage` and `expired` may take at most what is
      available (`422 validation_failed` on `body.quantity`). An `expired`
      write-off with `batchIds` that finds nothing left to write off is `409
      conflict`.
    x-idempotency: required
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/catalogue.yaml#/MovementCreate
          examples:
            restock:
              value:
                kind: restock
                quantity: 12
                expiresOn: "2026-11-20"
                costPaise: 5000
            count:
              value:
                kind: count_correction
                quantity: 7
            markExpired:
              value:
                kind: expired
                batchIds: [01JB0SB4T5C6H7E8X9P0R1D2E3]
    responses:
      "201":
        description: The item after the write and the movements written
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/MovementResult
            example:
              item:
                id: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
                storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
                productId: 01JB0S9P1R2D3C4T5M6A7S8T9R
                name: Amul Butter
                productName: Amul Butter
                localName: null
                brand: Amul
                variant: Pasteurised
                packSize: 100
                unit: g
                categoryId: 01J43RW0000000000000000082
                barcodes: ["8901262010016"]
                pricePaise: 5800
                mrpPaise: null
                productMrpPaise: 6000
                onHand: 22
                reserved: 0
                available: 22
                lowStockAt: null
                lowStock: false
                isListed: true
                stockUpdatedAt: "2026-10-23T05:00:00Z"
                stale: false
                createdAt: "2026-10-01T05:00:00Z"
                updatedAt: "2026-10-23T05:00:00Z"
              movements:
                - id: 01JB0SC5M6V7T8X9Y0Z1A2B3C4
                  delta: 12
                  source: restock
                  refType: null
                  refId: null
                  note: null
                  createdAt: "2026-10-23T05:00:00Z"
                  batches:
                    - batchId: 01JB0SB4T5C6H7E8X9P0R1D2E3
                      delta: 12
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/items/{itemId}/history:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: itemId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getStoreItemHistory
    tags: [catalogue]
    summary: An item's stock movements, newest first
    description: Cashier and above.
    parameters:
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: One page of movements
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/MovementList
            example:
              items:
                - id: 01JB0SC5M6V7T8X9Y0Z1A2B3C4
                  delta: -2
                  source: sale_pos
                  refType: null
                  refId: null
                  note: null
                  createdAt: "2026-10-23T05:00:00Z"
                  batches:
                    - batchId: 01JB0SB4T5C6H7E8X9P0R1D2E3
                      delta: -2
              nextCursor: null
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/batches:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: listStockBatches
    tags: [catalogue]
    summary: Expiry and cost batches
    description: >-
      Manager and above (`batches.manage`, D-99). Batches with stock left,
      earliest expiry first (undated after dated). `itemId` narrows to one
      item; `empty` includes batches used up; `expiresBefore` keeps batches
      that expire before that date. Each batch carries its `etag` for the
      `If-Match` of a PATCH.
    parameters:
      - name: itemId
        in: query
        schema:
          $ref: ../schemas/common.yaml#/Ulid
      - name: empty
        in: query
        schema:
          type: boolean
      - name: expiresBefore
        in: query
        schema:
          type: string
          format: date
          maxLength: 10
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      "200":
        description: The batches
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/StockBatchList
            example:
              items:
                - id: 01JB0SB4T5C6H7E8X9P0R1D2E3
                  itemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
                  itemName: Curd 400 g
                  receivedQuantity: 10
                  quantity: 10
                  expiresOn: "2026-10-26"
                  expired: false
                  receivedAt: "2026-10-20T05:00:00Z"
                  costPaise: 2800
                  foundInCount: false
                  pricePaise: 3500
                  mrpPaise: 3500
                  updatedAt: "2026-10-20T05:00:00Z"
                  etag: '"v1"'
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/batches/{batchId}:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: batchId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  patch:
    operationId: updateStockBatch
    tags: [catalogue]
    summary: Correct a batch's cost or expiry
    description: >-
      Manager and above (`batches.manage`, D-99). Cost and expiry only; the
      quantities change only through movements, and no endpoint creates a
      batch. Audited with before and after. A "found in count" batch takes no
      expiry (`422 validation_failed`).
    x-idempotency: none
    parameters:
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/catalogue.yaml#/StockBatchUpdate
          example:
            costPaise: 2400
    responses:
      "200":
        description: The batch after the change
        headers:
          ETag:
            $ref: ../common/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/StockBatch
            example:
              id: 01JB0SB4T5C6H7E8X9P0R1D2E3
              itemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
              itemName: Salt 1 kg
              receivedQuantity: 30
              quantity: 30
              expiresOn: null
              expired: false
              receivedAt: "2026-10-20T05:00:00Z"
              costPaise: 2400
              foundInCount: false
              pricePaise: 2400
              mrpPaise: 2800
              updatedAt: "2026-10-23T05:00:00Z"
              etag: '"v2"'
      default:
        $ref: ../common/responses.yaml#/Problem
