# Paths: domain "catalogue" (owner W1-05): products, items, stock and imports (04 §2.6).
#
# W1-05 weekend slice. `{B}` = /v1/biz/businesses/{bid}, `{S}` = {B}/stores/{sid};
# the permission engine reads the scope from `bid` and `sid`. Roles per
# operation are in internal/platform/authz/policy/catalogue.go (02 §3.3).
# Deferred (W1-05 report): `POST {B}/products` (review queue), item imports,
# the catalogue snapshot and delta feed.
/v1/discover/categories:
  get:
    operationId: listCategories
    tags: [catalogue]
    summary: The category tree with tints and icons
    description: >-
      Public. Top-level categories by their sort order, each with its
      children. `name` is in the language of `Accept-Language` when the
      category has it, else English.
    security: []
    parameters:
      - $ref: ../common/parameters.yaml#/AcceptLanguage
    responses:
      "200":
        description: Every category
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/CategoryList
            example:
              items:
                - id: 01J43RW0000000000000000080
                  slug: grocery
                  name: Grocery
                  names: {en: Grocery, hi: किराना}
                  tint: green
                  icon: shopping-basket
                  children:
                    - id: 01J43RW0000000000000000081
                      slug: staples
                      name: Staples
                      names: {en: Staples}
                      tint: green
                      icon: wheat
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/products/search:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: searchProducts
    tags: [catalogue]
    summary: Search the master catalogue to add an item
    description: >-
      Cashier and above (D-37). `barcode` is an exact match; `q` matches the
      name, variant or brand. One of them is required (`422
      validation_failed` otherwise). With `storeId`, `inStore` says whether
      that store already lists the product.
    parameters:
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - name: barcode
        in: query
        schema:
          type: string
          pattern: ^[0-9A-Za-z-]{4,32}$
      - name: storeId
        in: query
        schema:
          $ref: ../schemas/common.yaml#/Ulid
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      "200":
        description: Matching active products, best match first
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/ProductMatchList
            example:
              items:
                - id: 01JB0S9P1R2D3C4T5M6A7S8T9R
                  name: Amul Butter
                  brand: Amul
                  variant: Pasteurised
                  packSize: 100
                  unit: g
                  mrpPaise: 6000
                  categoryId: 01J43RW0000000000000000082
                  barcodes: ["8901262010016"]
                  inStore: false
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/items:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: listStoreItems
    tags: [catalogue]
    summary: The store's items (B-07)
    description: >-
      Cashier and above. By product name. `q` matches the name, local name,
      variant, brand or an exact barcode; `categoryId` includes its children;
      `lowStock` keeps items at or below their threshold; `listed` keeps
      listed items only.
    parameters:
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - name: categoryId
        in: query
        schema:
          $ref: ../schemas/common.yaml#/Ulid
      - name: lowStock
        in: query
        schema:
          type: boolean
      - name: listed
        in: query
        schema:
          type: boolean
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: One page of items
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/StoreItemList
            example:
              items:
                - id: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
                  storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
                  productId: 01JB0S9P1R2D3C4T5M6A7S8T9R
                  name: Amul Butter
                  productName: Amul Butter
                  localName: null
                  brand: Amul
                  variant: Pasteurised
                  packSize: 100
                  unit: g
                  categoryId: 01J43RW0000000000000000082
                  barcodes: ["8901262010016"]
                  pricePaise: 5800
                  mrpPaise: null
                  productMrpPaise: 6000
                  onHand: 10
                  reserved: 2
                  available: 8
                  lowStockAt: null
                  lowStock: false
                  isListed: true
                  stockUpdatedAt: "2026-10-23T05:00:00Z"
                  stale: false
                  createdAt: "2026-10-01T05:00:00Z"
                  updatedAt: "2026-10-23T05:00:00Z"
              nextCursor: null
      default:
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: createStoreItem
    tags: [catalogue]
    summary: List a master product in the store
    description: >-
      Manager and above (`item.manage`; the price also needs
      `item.price.edit`). A product the store already lists is `409
      conflict`. `openingStock` writes an `opening` movement.
    x-idempotency: optional
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/catalogue.yaml#/StoreItemCreate
          example:
            productId: 01JB0S9P1R2D3C4T5M6A7S8T9R
            pricePaise: 5800
            openingStock: 10
            expiresOn: "2026-11-20"
            costPaise: 5000
    responses:
      "201":
        description: The new item
        headers:
          ETag:
            $ref: ../common/headers.yaml#/ETag
        content:
          application/json:
            schema:
              $ref: ../schemas/catalogue.yaml#/StoreItem
            example:
              id: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
              storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
              productId: 01JB0S9P1R2D3C4T5M6A7S8T9R
              name: Amul Butter
              productName: Amul Butter
              localName: null
              brand: Amul
              variant: Pasteurised
              packSize: 100
              unit: g
              categoryId: 01J43RW0000000000000000082
              barcodes: ["8901262010016"]
              pricePaise: 5800
              mrpPaise: null
              productMrpPaise: 6000
              onHand: 10
              reserved: 0
              available: 10
              lowStockAt: null
              lowStock: false
              isListed: true
              stockUpdatedAt: "2026-10-23T05:00:00Z"
              stale: false
              createdAt: "2026-10-23T05:00:00Z"
              updatedAt: "2026-10-23T05:00:00Z"
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/items/{itemId}:
  parameters:
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: itemId
      in: path
      required: true
