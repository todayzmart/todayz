    parameters:
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/catalogue.yaml#/StoreItemUpdate
          example:
            pricePaise: 5600
            isListed: true
    responses:
      "200":
        description: The item after the change
        headers:
          ETag:
