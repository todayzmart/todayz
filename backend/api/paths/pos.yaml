# Paths: domain "pos" (owner W2-04): point of sale and bill claims (04 §2.4, §2.6).
#
# `/v1/biz/businesses/{bid}/stores/{sid}` is `{S}` in 04 §2.6; the permission
# engine reads the scope from `bid` and `sid`. Roles per operation are in
# internal/platform/authz/policy/pos.go. Every unsafe POS route takes an
# Idempotency-Key; a sale, its reversal, the bill-claim confirm and the
# counter-code verify are `x-money` (04 §1.6). Offline sales come through
# `POST {S}/sync` (sync.yaml). Credits and cashback are held and posted by the
# wallet (W2-01) through internal/pos's seams; until it lands no credits are
# spent and no cashback is earned (W2-04 report).
/v1/biz/businesses/{bid}/stores/{sid}/pos/sales:
  parameters:
  - name: bid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: sid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: listPosSales
    tags:
    - pos
    summary: The store's sales history (B-05)
    description: >-
      Cashier and above (`pos.sales`). Every sale of the store, online and synced, newest first by the
      device's sale time, with its link status; a failed offline counter code carries `link.failure`
      ("Customer link failed", D-12). The customer is named only for `bill_qr` and `counter_code`; a phone
      is never returned and no receipt token is.
    parameters:
    - $ref: ../common/parameters.yaml#/Limit
    - $ref: ../common/parameters.yaml#/Cursor
    - &salesFrom
      name: from
      in: query
      description: The first day, an IST calendar date, inclusive (D-268).
      schema:
        type: string
        format: date
    - &salesTo
      name: to
      in: query
      description: The last day, an IST calendar date, inclusive; not before `from`.
      schema:
        type: string
        format: date
    - &salesPayment
      name: payment
      in: query
      schema:
        $ref: ../schemas/pos.yaml#/PosPaymentMethod
    - &salesStatus
      name: status
      in: query
      schema:
        $ref: ../schemas/pos.yaml#/PosSaleStatus
    - &salesLink
      name: link
      in: query
      schema:
        $ref: ../schemas/pos.yaml#/PosSaleLinkFilter
    - &salesOffline
      name: offline
      in: query
      description: '`true`: only sales that came through `{S}/sync`; `false`: only online sales.'
      schema:
        type: boolean
    - &salesCashier
      name: cashier
      in: query
      description: Only the sales this staff member rang.
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    responses:
      '200':
        description: The sales
        content:
          application/json:
            schema:
              $ref: ../schemas/pos.yaml#/PosSaleList
            example:
              items:
              - id: 01JB0V2S4K3E5S6A7K8E9X0Y1Z
                clientId: 01JB0V1S4K3C5K6N7T8D9X0Y1Z
                soldAt: '2026-10-24T05:00:00Z'
                receivedAt: '2026-10-24T07:00:00Z'
                totalPaise: 30000
                lineCount: 1
                unitCount: 3
                paymentMethod: cash
                creditsUsed: 0
                cashbackCredits: 0
                status: completed
                reversedAt: null
                offline: true
                cashier:
                  id: 01JB0C4S1H2J3E4R5V6S7E8R9Z
                  name: Ravi
                link:
                  method: counter_code
                  status: failed
                  customerName: null
                  failure: code_used
              nextCursor: null
              serverNow: '2026-10-24T07:04:00Z'
      default:
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: createPosSale
    tags:
    - pos
    summary: Ring an online sale (B-03)
    description: >-
      Cashier and above (`pos.sell`). Idempotent by `clientId` as well as the key: a second call with the
      same `clientId` returns the first sale. Catalogued lines are sold at the item's price now (`409
      price_changed` with `extensions.storeItemId` and `extensions.pricePaise` when the POS's price is
      old) and offers are applied by the server; each writes a `sale_pos` movement. A line above the
      item's available units (on hand less what accepted online orders hold, summed over the bill's lines
      of that item) is `409 insufficient_stock` with `extensions.storeItemId` and `extensions.available`
      (the item's available before this sale), and nothing is written (D-270). An offline sale that
      arrives through sync is never refused for stock (02 §4.3). A manual line or bill discount needs `pos.discount` (manager and above, D-06).
      Round-off to the nearest ₹1 is automatic (D-94). `link.method: bill_qr` takes the claim the customer
      confirmed (`409 claim_mismatch` when the bill changed since the QR, `409 claim_expired`, `409
      claim_already_used` when another sale used it) and spends its credits; `counter_code` needs a right
      code for this `clientId` first; `phone_unverified` touches no ledger (D-07). The response carries the
      receipt token (D-45).
    x-idempotency: required
    x-money: true
    x-problems:
    - price_changed
    - insufficient_stock
    - claim_expired
    - claim_already_used
    - claim_mismatch
    - code_locked
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/pos.yaml#/PosSaleCreateRequest
          example:
            clientId: 01JB0V1S4K3C5K6N7T8D9X0Y1Z
            lines:
            - clientId: 01JB0V1K1N2E3C4K5N6T7D8X9Y
              storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
              unitPricePaise: 5800
              quantity: 2
            - clientId: 01JB0V1K2N3E4C5K6N7T8D9X0Y
              name: Loose sugar 500 g
              unitPricePaise: 2450
              quantity: 1
            paymentMethod: cash
    responses:
      '200':
        description: The sale
        content:
          application/json:
            schema:
              $ref: ../schemas/pos.yaml#/PosSale
            example:
              id: 01JB0V2S4K3E5S6A7K8E9X0Y1Z
              clientId: 01JB0V1S4K3C5K6N7T8D9X0Y1Z
              lines:
              - id: 01JB0V2K1N2E3S4A5K6E7X8Y9Z
                clientId: 01JB0V1K1N2E3C4K5N6T7D8X9Y
                storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
                name: Amul Butter 100 g
                unitPricePaise: 5800
                quantity: 2
                offerDiscountPaise: 0
                manualDiscountPaise: 0
                lineTotalPaise: 11600
              - id: 01JB0V2K2N3E4S5A6K7E8X9Y0Z
                clientId: 01JB0V1K2N3E4C5K6N7T8D9X0Y
                storeItemId: null
                name: Loose sugar 500 g
                unitPricePaise: 2450
                quantity: 1
                offerDiscountPaise: 0
                manualDiscountPaise: 0
                lineTotalPaise: 2450
              itemSubtotalPaise: 14050
              billOfferDiscountPaise: 0
              subtotalPaise: 14050
              discountPaise: 0
              roundOffPaise: 50
              creditsUsed: 0
              cashbackCredits: 0
              totalPaise: 14100
              paymentMethod: cash
              link: null
              status: completed
              reversedAt: null
              reversalReason: null
              soldAt: '2026-10-24T05:00:00Z'
              receivedAt: '2026-10-24T05:00:00Z'
              receiptToken: EXAMPLE_receipt_000000
              version: 1
              serverNow: '2026-10-24T05:00:00Z'
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/pos/sales-summary:
  parameters:
  - name: bid
