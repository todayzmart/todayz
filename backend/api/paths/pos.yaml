              - method: upi
                billCount: 20
                totalPaise: 550000
              byCashier:
              - cashier:
                  id: 01JB0C4S1H2J3E4R5V6S7E8R9Z
                  name: Ravi
                billCount: 50
                totalPaise: 1250000
              serverNow: '2026-10-24T13:00:00Z'
      default:
