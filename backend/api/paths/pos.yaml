    - *salesStatus
    - *salesLink
    - *salesOffline
    - *salesCashier
    responses:
      '200':
        description: The CSV
        content:
          text/csv:
            schema:
              type: string
            example: |
              sale_id,sold_at_ist,received_at_ist,status,payment_method,lines,units,discount_inr,credits_used,cashback_credits,total_inr,offline,link_method,link_status,customer_name,cashier,reversed_at_ist,reversal_reason
              01JB0V2S4K3E5S6A7K8E9X0Y1Z,2026-10-24 10:30,2026-10-24 12:30,completed,cash,1,3,0.00,0,0,300.00,true,counter_code,failed,,Ravi,,
      default:
        $ref: ../common/responses.yaml#/Problem
