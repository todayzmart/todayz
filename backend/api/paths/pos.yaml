/v1/biz/businesses/{bid}/stores/{sid}/bill-claims:
  parameters:
  - name: bid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: sid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: createBillClaim
    tags:
    - pos
    summary: Show a bill QR (B-03)
    description: >-
      Cashier and above (`pos.link_customer`). Makes a signed token for the bill the POS is about to ring
      (`saleClientId`, the bill after discounts). It expires after 120 s; show a new one after that (01
      §6). Making a new QR for the same `saleClientId` leaves the old one to expire. The POS follows the
      claim on the store's stream (`bill_claim.updated`) or by reading it. `409 conflict` while
      `feature_bill_qr_enabled` is off.
    x-idempotency: required
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/pos.yaml#/BillClaimCreateRequest
          example:
            saleClientId: 01JB0V1S4K3C5K6N7T8D9X0Y1Z
            amountPaise: 14050
    responses:
      '201':
        description: The bill QR
        content:
          application/json:
            schema:
              $ref: ../schemas/pos.yaml#/BillClaim
            example:
              id: 01JB0V3C1A2J3M4B5K6Q7R8S9T
              saleClientId: 01JB0V1S4K3C5K6N7T8D9X0Y1Z
              amountPaise: 14050
              status: open
              token: EXAMPLE_bill_qr_0000000000000000000000000000000000000000000000
              expiresAt: '2026-10-24T05:02:00Z'
              customerName: null
              creditsUsed: 0
              posSaleId: null
              version: 1
              serverNow: '2026-10-24T05:00:00Z'
      default:
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/bill-claims/{claimId}:
  parameters:
  - name: bid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: sid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: claimId
    in: path
    required: true
