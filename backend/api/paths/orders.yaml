  - name: bid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: sid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: orderId
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: failOrderDelivery
    tags:
    - orders
    summary: Record a failed delivery
    description: >-
      Cashier and above, only from out_for_delivery (D-22); `other` needs `note`. The held credits are
      released, no cashback, and the stock stays reserved until the shop confirms the return (D-69); the
      shop is reminded in its inbox 2 h and 24 h later, and at 72 h the reservations are released as
      `unconfirmed` and the shop is flagged. `409 invalid_transition` from any other state.
    x-idempotency: required
    x-money: true
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/orders.yaml#/FailDeliveryRequest
          example:
            reason: customer_unreachable
    responses:
      '200':
        description: The order after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/orders.yaml#/StoreOrder
            example:
              id: 01JB0T0RD3R5N6Q7W8X9Y0Z1A2
              number: TZ-024817
              customer:
                name: Asha
                phoneMasked: 90•••••001
                phone: null
