/v1/me/orders:
  get:
    operationId: listMyOrders
    tags:
    - orders
    summary: My online orders (C-13)
    description: >-
      Customer app. Newest first. `status=active` keeps orders that are not finished, `past` the finished
      ones; both when omitted.
    parameters:
    - name: status
      in: query
      schema:
        type: string
        enum:
        - active
        - past
    - $ref: ../common/parameters.yaml#/Limit
    - $ref: ../common/parameters.yaml#/Cursor
    responses:
      '200':
        description: My orders
        content:
          application/json:
            schema:
              $ref: ../schemas/orders.yaml#/OrderList
            example:
              items:
              - id: 01JB0T0RD3R5N6Q7W8X9Y0Z1A2
                number: TZ-024817
                store:
                  id: 01JB0S3M4N5P6Q7R8S9T0V1W2X
                  slug: sri-lakshmi-stores-jayanagar
                  name: Sri Lakshmi Stores
                  addressLine: 12, 4th Cross, Jayanagar
                  locality: Jayanagar
                fulfilment: pickup
                status: accepted
                statusReason: null
                itemCount: 2
                totalPaise: 40100
                acceptBy: null
                holdUntil: '2026-10-23T05:33:00Z'
                placedAt: '2026-10-23T05:00:00Z'
                version: 2
              nextCursor: null
              serverNow: '2026-10-23T05:04:00Z'
      default:
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: createOrder
    tags:
    - orders
    summary: Place an order
    description: >-
      Customer app; idempotent (BK-04). Re-prices and rechecks stock in one transaction: `409 price_changed`
      with the fresh quote in `extensions.quote` when the total is not `expectedTotalPaise`; `409 insufficient_stock`
      naming the line in `extensions.storeItemId` and `extensions.available`. Sets `accept_by` from `order_accept_timeout_min`,
      notifies the store and starts the accept timer. Nothing is reserved until the shop accepts (D-01).
      `409 store_closed` for a pickup order outside opening hours or while closed by the shop; a delivery
      order follows the delivery hours alone (D-219), so it answers `409 delivery_closed` instead, as the
      quote does; `409 store_not_bookable` when
      the store takes no orders of this fulfilment or is not live; delivery is checked as in the quote
      (`below_minimum`, `delivery_closed`, radius) and snapshots the address onto the order;
      `409 ordering_suspended` with `extensions.until` while no-show strikes limit the account and it
      already has an unfinished order (01 §5.4); with `creditsToUse` the credits are held in the same
      transaction (W2-01): `409 below_credit_minimum`, `credit_max_exceeded`, `credit_monthly_cap` or
      `store_credit_cap` when a credit rule refuses them, `409 price_changed` when the wallet no longer
      covers them; `409 ask_reply_used` (with `extensions.orderId`) and
      `409 ask_price_expired` (with `extensions.quote`) for a booking from an ask reply (D-101). The response
      never carries the pickup code; read the order for it.
    x-idempotency: required
    x-money: true
    x-problems:
    - price_changed
    - insufficient_stock
    - store_closed
    - store_not_bookable
    - delivery_closed
    - below_minimum
    - ordering_suspended
    - ask_reply_used
    - ask_price_expired
    - below_credit_minimum
    - credit_max_exceeded
    - credit_monthly_cap
    - store_credit_cap
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/orders.yaml#/OrderCreateRequest
          example:
            storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
            fulfilment: pickup
            creditsToUse: 0
