# Paths: domain "orders" (owner W2-02, W2-04): customer and shop order flows (04 §2.4, §2.6).
#
# Pre-created empty by W0-04 so parallel work packages never edit the same file
# (D-50). Every operation: `tags: [orders]`, an operationId unique across the
# API, an example per request and success response, and `default:
# {$ref: ../common/responses.yaml#/Problem}`. Domain problem codes are listed
# under `x-problems`.
#
# W2-02. `/v1/biz/businesses/{bid}/stores/{sid}` is `{S}` in 04 §2.6; the
# permission engine reads the scope from `bid` and `sid`. Roles per operation
# are in internal/platform/authz/policy/orders.go. Every unsafe order route
# takes a required Idempotency-Key; order create and every transition is
# `x-money` (04 §1.6). The checkout quote lives here, not in a checkout
# domain: it is the orders package's pricing (W2-02 report). Delivery,
# dispatch, failed deliveries and returns came with the W2-02 delivery half
# (docs/qa/W2-02-delivery/REPORT.md).
/v1/me/checkout/quote:
  post:
    operationId: quoteCheckout
    tags:
    - orders
    summary: Price a cart before placing it (C-11)
    description: >-
      Customer app. No side effects. Re-reads prices and stock now. Lines are priced from the store item's
      price; an `askReplyId` that is this customer's Yes for this store prices that item's line at the
      replied price while it is valid (`priceSource: ask_reply`, D-101) and is ignored otherwise. `orderable`
      is false while any line is short. Credits (W2-01): `creditsAllowed` is what the wallet, the per-order
      max, the ₹1 floor and the caps allow for `creditsToUse`; `creditsLimit` says why it is less (D-76). `409 store_not_bookable` for a store that takes no orders of this
      fulfilment, and for delivery while `feature_delivery_enabled` is off or the address is outside the
      delivery radius (`extensions.reason: outside_delivery_radius`). Delivery (BK-23) needs `addressId`
      (`422 validation_failed` on `body.addressId` otherwise); `409 below_minimum` with `extensions.minimumPaise`
      when the item subtotal is under the store's minimum (D-94); `409 delivery_closed` outside delivery hours
      with `extensions.nextDeliveryWindow` (`NextDeliveryWindow`, null when nothing opens within 7 days);
      the fee is 0 when the item subtotal is at or above the store's free-delivery amount. `409 ask_reply_used` when the reply already
      has an active order; `409 ordering_suspended` with `extensions.until` while no-show strikes limit the
      account and it already has an unfinished order (BK-16, 01 §5.4; placing checks it again).
    x-idempotency: none
    x-problems:
    - store_not_bookable
    - delivery_closed
    - below_minimum
    - ask_reply_used
    - ordering_suspended
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/orders.yaml#/CheckoutQuoteRequest
          example:
            storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
            fulfilment: pickup
            creditsToUse: 0
            items:
            - storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
              quantity: 2
            - storeItemId: 01JB0SA2T3E4M5S6H7D8X9Y0Z1
              quantity: 1
    responses:
      '200':
        description: The priced cart
        content:
          application/json:
            schema:
              $ref: ../schemas/orders.yaml#/CheckoutQuote
            example:
              storeId: 01JB0S3M4N5P6Q7R8S9T0V1W2X
              fulfilment: pickup
              lines:
              - storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z0
                productId: 01JB0S9P1R2D3C4T5M6A7S8T9R
                name: Amul Butter
                variant: Pasteurised
                packSize: 100
                unit: g
                imageKey: null
                quantity: 2
                availableQuantity: 9
                availability: in_stock
                unitPricePaise: 5800
                mrpPaise: 6000
                lineSubtotalPaise: 11600
                discountPaise: 0
                lineTotalPaise: 11600
                priceSource: catalogue
                validUntil: null
              - storeItemId: 01JB0SA2T3E4M5S6H7D8X9Y0Z1
                productId: 01JB0S9P2R3D4C5T6M7A8S9T0R
                name: Aashirvaad Atta
                variant: null
                packSize: 5
                unit: kg
                imageKey: null
                quantity: 1
                availableQuantity: 4
                availability: in_stock
                unitPricePaise: 28500
                mrpPaise: 29500
                lineSubtotalPaise: 28500
                discountPaise: 0
                lineTotalPaise: 28500
                priceSource: catalogue
                validUntil: null
              subtotalPaise: 40100
              discountPaise: 0
              itemSubtotalPaise: 40100
              itemsAfterOffersPaise: 40100
