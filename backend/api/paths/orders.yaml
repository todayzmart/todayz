  parameters:
  - name: orderId
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: confirmPartialOrder
    tags:
    - orders
    summary: Take or decline a partly accepted order
    description: >-
      From awaiting_customer before `partialConfirmBy` (D-28, strict). `accept: true` holds the accepted
      quantities as reservations and starts the pickup hold (`pickup_hold_min`); `409 insufficient_stock` naming
      the line when one is no longer available (the order keeps waiting). `accept: false` cancels with
      `declined_partial`. At or after `partialConfirmBy` this is `409 invalid_transition`; the order is cancelled
      `partial_timeout` with no strike (BK-10). When the credit rules tightened while the order waited, so a
      confirm would keep fewer credits than the order shows, it is `409 price_changed`: the order keeps waiting
      with the lower credits and the new total, and the customer answers again.
    x-idempotency: required
    x-money: true
    x-problems:
    - insufficient_stock
    - price_changed
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/orders.yaml#/ConfirmPartialRequest
          example:
            accept: true
    responses:
      '200':
        description: The order after the change
