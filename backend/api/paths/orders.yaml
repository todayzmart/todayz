/v1/biz/businesses/{bid}/stores/{sid}/orders/{orderId}/verify-code:
  parameters:
  - name: bid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: sid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: orderId
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: verifyOrderCode
    tags:
    - orders
    summary: Hand over an order with the customer's code
    description: >-
      Cashier and above, from accepted or ready (pickup) or out_for_delivery (delivery, BK-26). The code is checked against this order only, in constant
      time (D-04). A wrong code is `422 code_invalid` with `extensions.attemptsLeft`; the 5th wrong code
      locks it (`409 code_locked`) until the customer gets a new one. A right code marks the order collected,
      records the payment method and sells the reserved stock (`sale_online`, D-01); a delivery order
      becomes delivered.
    x-idempotency: required
    x-money: true
    x-problems:
    - code_invalid
    - code_locked
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/orders.yaml#/VerifyCodeRequest
          example:
            code: '4821'
            paymentMethod: upi
    responses:
      '200':
        description: The order after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/orders.yaml#/StoreOrder
            example:
              id: 01JB0T0RD3R5N6Q7W8X9Y0Z1A2
