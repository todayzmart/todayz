/v1/biz/businesses/{bid}/stores/{sid}/orders/{orderId}/confirm-return:
  parameters:
  - name: bid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: sid
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  - name: orderId
    in: path
    required: true
    schema:
      $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: confirmOrderReturn
    tags:
    - orders
    summary: Settle the goods of a failed delivery
    description: >-
      `returned`: cashier and above, releases the reservations; `damaged`: manager and above (`403 forbidden`
      for a cashier), writes one `damage` movement per line, then releases (D-69). Once per failed delivery:
      a second confirm, or one after the 72 h auto-release, is `409 invalid_transition`. The status stays
      delivery_failed; `returnOutcome` and `returnConfirmedAt` are set.
    x-idempotency: required
    x-money: true
    parameters:
    - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/orders.yaml#/ConfirmReturnRequest
          example:
            outcome: returned
    responses:
      '200':
        description: The order after the change
        content:
          application/json:
            schema:
