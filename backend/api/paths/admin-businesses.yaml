    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-businesses.yaml#/AdminKycRevealRequest
          example:
            field: pan
    responses:
      "200":
        description: The value
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-businesses.yaml#/AdminKycReveal
            example:
              field: pan
              value: ABCDE1234F
      default: *problem
