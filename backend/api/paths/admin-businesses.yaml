# Paths: domain "admin-businesses" (owner W3-05): A-03 Businesses, the KYC queue (04 §2.7, 01 §3, D-40, D-44).
#
# `support` reads (the queue and the detail, KYC masked); `admin` and `super_admin` verify, ask for
# information, reject, suspend, reinstate, review KYC and documents, and reveal one KYC value. Every
# change is audited with its reason. Roles per operation are in internal/platform/authz/policy/admin.go.
/v1/admin/businesses:
  get:
    operationId: listAdminBusinesses
    tags: [admin-businesses]
    summary: The business queue, newest first
    description: "`status` picks a queue tab (A-03: submitted, needs_info, verified, suspended); every business when omitted."
    parameters:
      - name: status
        in: query
        schema:
          $ref: ../schemas/admin-businesses.yaml#/AdminBusinessStatus
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: Businesses
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-businesses.yaml#/AdminBusinessList
            example:
              items:
                - id: 01JB0SBZ1A2B3C4D5E6F7G8H9J
                  brandName: Annapurna Kirana
                  legalName: Annapurna Traders
                  status: submitted
                  city: Bengaluru
                  storeCount: 1
                  submittedAt: "2026-10-23T09:00:00Z"
                  createdAt: "2026-10-20T09:00:00Z"
              nextCursor: null
              serverNow: "2026-10-24T11:00:00Z"
      default: &problem
        $ref: ../common/responses.yaml#/Problem
/v1/admin/businesses/{businessId}:
  parameters:
    - name: businessId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getAdminBusiness
    tags: [admin-businesses]
    summary: One business with KYC (masked), stores, staff and documents
    responses:
      "200":
        description: The business
        content:
