    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-businesses.yaml#/AdminBusinessVerify
          example:
            note: PAN and storefront checked
    responses:
      "200":
        description: The business after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-businesses.yaml#/AdminBusiness
