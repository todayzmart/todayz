/v1/admin/businesses/{businessId}/verify:
  parameters:
    - name: businessId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: verifyAdminBusiness
    tags: [admin-businesses]
    summary: Verify a business (audited)
    description: >-
      From `submitted` only. The business turns `verified` and each of its stores in `pending_review` goes `live` in the same change (D-40: the first stores are reviewed with the business; a later store has its own review on A-05). Any other status is `409 invalid_transition`.
