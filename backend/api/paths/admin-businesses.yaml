/v1/admin/businesses/{businessId}/check-reject:
  parameters:
    - name: businessId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: rejectAdminShop
    tags: [admin-businesses]
    summary: Reject a shop at the check (audited)
    description: >-
      From `unchecked` only; anything else is `409 invalid_transition` (a checked shop is suspended
      instead). The reason is required, 1 to 500 characters, kept as the check note and in the audit log;
      it must not hold a phone number. In one change the business turns `rejected` (hidden from search at
      once), and every open online order of its stores is cancelled with the system reason
      `shop_rejected`: no strike for anyone, held stock, credits and offers go back, and each customer is
      told. Counter sales are not touched.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-businesses.yaml#/AdminBusinessChange
          example:
            reason: No shop at this address
    responses:
      "200":
        description: The shop after the reject, and how many orders it cancelled
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-businesses.yaml#/AdminShopRejected
            example:
              shop:
                id: 01JB0SBZ1A2B3C4D5E6F7G8H9J
                brandName: Annapurna Kirana
                legalName: Annapurna Traders
                status: rejected
                checkStatus: rejected
                checkNote: No shop at this address
                checkedAt: "2026-10-28T06:00:00Z"
                category: Grocery
                liveAt: "2026-10-27T05:00:00Z"
                createdAt: "2026-10-27T04:30:00Z"
                byFieldAgent: false
                kycStatus: submitted
                stores:
                  - id: 01JB0SST1A2B3C4D5E6F7G8H9J
                    name: Annapurna Kirana
                    status: live
                    addressLine1: 12, 4th Cross
                    locality: Jayanagar
                    city: Bengaluru
                    pincode: "560041"
                    lat: 12.9299
                    lng: 77.5826
                    liveAt: "2026-10-27T05:00:00Z"
