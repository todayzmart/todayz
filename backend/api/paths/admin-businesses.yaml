/v1/admin/businesses/{businessId}/check:
  parameters:
    - name: businessId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  post:
    operationId: checkAdminShop
    tags: [admin-businesses]
    summary: Mark a shop checked (audited)
    description: >-
      From `unchecked` only, for a live (`verified`) business; anything else is `409 invalid_transition`.
      The check releases the payout hold for later closes: a payout already held as `shop_unchecked` stays
      held until finance releases it on A-11 (a close never lifts a hold). The note is optional and kept in
      the audit log.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-businesses.yaml#/AdminBusinessVerify
          example:
            note: Visited the shop; storefront and stock match
    responses:
      "200":
        description: The shop after the check
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-businesses.yaml#/AdminShopCheck
            example:
              id: 01JB0SBZ1A2B3C4D5E6F7G8H9J
              brandName: Annapurna Kirana
              legalName: Annapurna Traders
              status: verified
              checkStatus: checked
              checkNote: Visited the shop; storefront and stock match
              checkedAt: "2026-10-28T06:00:00Z"
