              legalName: Annapurna Traders
              status: submitted
              needsInfoFields: []
              needsInfoNote: null
              submittedAt: "2026-10-23T09:00:00Z"
              verifiedAt: null
              createdAt: "2026-10-20T09:00:00Z"
              kyc:
                status: submitted
                legalName: Annapurna Traders
                panLast4: "234F"
                gstinLast4: "1Z5X"
                upiLast4: null
                bankLast4: "6789"
                bankIfsc: HDFC0001234
                notes: null
                verifiedAt: null
              stores:
                - id: 01JB0SST1A2B3C4D5E6F7G8H9J
                  name: Annapurna Kirana
                  status: pending_review
