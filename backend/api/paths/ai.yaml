# Paths: domain "ai" (owner W3-10 and each feature's WP): AI draft envelope and feature drafts (04 §2.8, D-46).
#
# Every operation: `tags: [ai]`, an operationId unique across the API, an example per request
# and success response, and `default: {$ref: ../common/responses.yaml#/Problem}`. Reference
# this domain's schemas as `../schemas/ai.yaml#/Name` and the shared ones as
# `../schemas/common.yaml#/Name`; parameters and headers from `../common/`.
#
# W3-11 (retailer AI, AI-R2, R3, R6, R9): `{S}` is `/v1/biz/businesses/{bid}/stores/{sid}`.
# Each feature has its three draft endpoints (create → 202, read, confirm) under its prefix,
# owner and manager only. A draft is reviewed and confirmed by a person; nothing changes stock,
# items, reviews or banners before the confirm, and the confirm applies only what the person
# sent, re-checked as if typed by hand (11 §1 rule 1). A feature is the common 404 while its
# flag is off or the model key is missing (11 §1 rule 2). AI-R4 insight text comes back inside
# `{S}/insights`, AI-R5 inside `{S}/coach/cards`, and AI-R10 has no endpoint (04 §2.8).
/v1/biz/businesses/{bid}/stores/{sid}/ai/retail:
  parameters: &store
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getStoreAiRetailFeatures
    tags: [ai]
    summary: Which retailer AI helpers are on for this store
    description: >-
      Owner and manager. One flag per W3-11 draft feature (on only while its switch is on and the
      model key is set), so the app shows or hides each entry point, and the photo limits. Counts
      nothing against the daily cap.
    responses:
      "200":
        description: The features
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiRetailFeatures
            example:
              supplierBill: true
              shelfPhoto: true
              reviewReply: true
              bannerCopy: false
              maxPhotoBytes: 4194304
              photoTypes: [image/jpeg, image/png, image/webp]
      default: &problem
        $ref: ../common/responses.yaml#/Problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/supplier-bill/drafts:
  parameters: *store
  post:
    operationId: createSupplierBillDraft
    tags: [ai]
    summary: Scan a supplier bill to restock (AI-R2)
    description: >-
      Owner and manager. A multipart form with `photo` (one photo of a distributor bill: image/jpeg,
      image/png or image/webp, at most 4 MB). Answers 202 at once; the model reads the lines in the
      background and the draft turns ready (lines matched to the store's items) or failed. The photo
      is not stored. One call against the store's daily AI cap (`429 ai_daily_cap_reached`). At most two photo scans (bill and shelf together) are read at once per store; a third is `429 rate_limited` until one finishes.
    x-upload: true
    x-idempotency: required
    x-problems: [ai_daily_cap_reached, rate_limited]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../schemas/ai.yaml#/AiPhotoUpload
          example:
            photo: '<a photo of the bill, image/jpeg>'
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0D, status: processing}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/supplier-bill/drafts/{draftId}:
  parameters: &draft
    - name: bid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: sid
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
    - name: draftId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getSupplierBillDraft
    tags: [ai]
    summary: A supplier bill draft
    description: >-
      The store's owner and managers. Each line is what the bill says (name, quantity, cost per
      unit, MRP, expiry when printed) and the store item it matched, or `match: null` (pick an item
      or create the product). A draft still processing after the provider timeout is closed as
      failed.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/SupplierBillDraft
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0D
              feature: supplier_bill
              status: ready
              promptVersion: supplier_bill/prompt@1
              createdAt: "2026-10-25T05:30:00Z"
              supplier: Sri Lakshmi Agencies
              billDate: "2026-10-24"
              lines:
                - lineId: l1
                  name: AMUL BUTTER 100G
                  quantity: 12
                  costPaise: 5200
                  mrpPaise: 6000
                  expiresOn: "2026-12-20"
                  confidence: 0.95
                  match: {storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z1, itemName: Amul Butter 100 g, onHand: 4}
                - lineId: l2
                  name: GOOD DAY CASHEW 75G
                  quantity: 24
                  costPaise: 1800
                  mrpPaise: 2000
                  expiresOn: null
                  confidence: 0.7
                  match: null
              outcomes: []
              failure: null
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/supplier-bill/drafts/{draftId}/confirm:
  parameters: *draft
  post:
    operationId: confirmSupplierBillDraft
    tags: [ai]
    summary: Confirm a supplier bill draft
    description: >-
      The store's owner and managers. One decision per line; a line with no decision is discarded.
      Accepted and edited lines become `supplier_bill` stock movements with a batch (quantity, cost
      per unit, expiry), in one transaction. A line still without a store item, a quantity out of
      range, a cost above the MRP or an expiry in the past is `422 validation_failed` and nothing is
      applied. Idempotent: a repeat answers the first result and applies nothing again. A draft not
      ready is `409 invalid_transition`.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/SupplierBillConfirmRequest
          example:
            lines:
              - {lineId: l1, outcome: accepted}
              - lineId: l2
                outcome: edited
                value: {storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z2, quantity: 24, costPaise: 1800, expiresOn: null}
    responses:
      "200":
        description: The outcomes
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiConfirmResult
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0D
              status: confirmed
              lines:
                - {lineId: l1, outcome: accepted}
                - {lineId: l2, outcome: edited}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/shelf-photo/drafts:
  parameters: *store
  post:
    operationId: createShelfPhotoDraft
    tags: [ai]
    summary: Shelf photo to catalogue (AI-R3)
    description: >-
      Owner and manager. A multipart form with `photo` (one shelf photo: image/jpeg, image/png or
      image/webp, at most 4 MB). Answers 202 at once; the model names the products it sees and the
      server matches them to the master catalogue in the background. The photo is not stored. One
      call against the store's daily AI cap (`429 ai_daily_cap_reached`). At most two photo scans (bill and shelf together) are read at once per store; a third is `429 rate_limited` until one finishes.
    x-upload: true
    x-idempotency: required
    x-problems: [ai_daily_cap_reached, rate_limited]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../schemas/ai.yaml#/AiPhotoUpload
          example:
            photo: '<a shelf photo, image/jpeg>'
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0E, status: processing}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/shelf-photo/drafts/{draftId}:
  parameters: *draft
  get:
    operationId: getShelfPhotoDraft
    tags: [ai]
    summary: A shelf photo draft
    description: >-
      The store's owner and managers. Each line is a product the model saw and the master product it
      matched (`product: null` when none did), with `listed: true` when the store already sells it.
      The price to add at defaults to the product's MRP.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/ShelfPhotoDraft
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0E
              feature: shelf_photo
              status: ready
              promptVersion: shelf_photo/prompt@1
              createdAt: "2026-10-25T05:30:00Z"
              lines:
                - lineId: l1
                  name: Maggi Masala Noodles
                  brand: Nestle
                  size: 70 g
                  confidence: 0.9
                  product: {productId: 01JB0P1R2Q3D4V5C6T7M8A9G0H, name: Maggi 2-Minute Masala Noodles, brand: Maggi, size: 70 g, mrpPaise: 1400}
                  listed: false
                  pricePaise: 1400
              outcomes: []
              failure: null
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/shelf-photo/drafts/{draftId}/confirm:
  parameters: *draft
  post:
    operationId: confirmShelfPhotoDraft
    tags: [ai]
    summary: Confirm a shelf photo draft
    description: >-
      The store's owner and managers. Accepted and edited lines become store items of their master
      product at the line's price (the MRP unless edited; above it is allowed, D-245) with the opening stock
      sent (0 when absent), through the same checks as adding an item by hand, in one transaction.
      A line without a product, or for a product the store already sells, is `422
      validation_failed` and nothing is applied. Idempotent. A draft not ready is `409
      invalid_transition`.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/ShelfPhotoConfirmRequest
          example:
            lines:
              - lineId: l1
                outcome: edited
                value: {productId: 01JB0P1R2Q3D4V5C6T7M8A9G0H, pricePaise: 1300, openingStock: 20}
    responses:
      "200":
        description: The outcomes
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiConfirmResult
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0E
              status: confirmed
              lines:
                - {lineId: l1, outcome: edited}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/review-reply/drafts:
  parameters: *store
  post:
    operationId: createReviewReplyDraft
    tags: [ai]
    summary: Draft a reply to a review (AI-R6)
    description: >-
      Owner and manager. `{reviewId}` of a review of this store without a reply. Answers 202; the
      model drafts one polite reply in the review's language in the background. One call against
      the store's daily AI cap (`429 ai_daily_cap_reached`).
    x-idempotency: required
    x-problems: [ai_daily_cap_reached]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/ReviewReplyDraftRequest
          example: {reviewId: 01JB2R0E1V2K3E4W5R6E7V8M9E}
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0F, status: processing}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/review-reply/drafts/{draftId}:
  parameters: *draft
  get:
    operationId: getReviewReplyDraft
    tags: [ai]
    summary: A review reply draft
    description: The store's owner and managers. One line, the reply text to edit.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/ReviewReplyDraft
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0F
              feature: review_reply
              status: ready
              promptVersion: review_reply/prompt@1
              createdAt: "2026-10-25T05:30:00Z"
              reviewId: 01JB2R0E1V2K3E4W5R6E7V8M9E
              lines:
                - {lineId: l1, text: Thank you for shopping with us! We are glad the milk was fresh., language: en}
              outcomes: []
              failure: null
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/review-reply/drafts/{draftId}/confirm:
  parameters: *draft
  post:
    operationId: confirmReviewReplyDraft
    tags: [ai]
    summary: Post the reply
    description: >-
      The store's owner and managers. `accepted` or `edited` (with the text) posts the reply to the
      review exactly as a typed reply (`409 review_reply_exists` when it already has one);
      `discarded` posts nothing. Idempotent. A draft not ready is `409 invalid_transition`.
    x-idempotency: required
    x-money: true
    x-problems: [review_reply_exists]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/ReviewReplyConfirmRequest
          example:
            lines:
              - lineId: l1
                outcome: edited
                value: {text: Thank you! See you again soon.}
    responses:
      "200":
        description: The outcome
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiConfirmResult
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0F
              status: confirmed
              lines:
                - {lineId: l1, outcome: edited}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/banner-copy/drafts:
  parameters: *store
  post:
    operationId: createBannerCopyDraft
    tags: [ai]
    summary: Draft banner copy (AI-R9)
    description: >-
      Owner and manager. Exactly one of `offerId` (an offer of this store) and `itemIds` (1 to 10
      of its items). Answers 202; the model drafts three headline and sub-line options in the
      shop's language and in English, each with a tint and one of the items for the photo. One
      call against the store's daily AI cap (`429 ai_daily_cap_reached`).
    x-idempotency: required
    x-problems: [ai_daily_cap_reached]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/BannerCopyDraftRequest
          example: {offerId: 01JB2F1F2F3E4R5Q6F7F8E9R0A}
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0G, status: processing}
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/banner-copy/drafts/{draftId}:
  parameters: *draft
  get:
    operationId: getBannerCopyDraft
    tags: [ai]
    summary: A banner copy draft
    description: The store's owner and managers. Three options; the person picks one and edits it.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/BannerCopyDraft
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0G
              feature: banner_copy
              status: ready
              promptVersion: banner_copy/prompt@1
              createdAt: "2026-10-25T05:30:00Z"
              language: kn
              lines:
                - lineId: l1
                  headline: ಹಾಲು ಮತ್ತು ಬೆಣ್ಣೆ ಮೇಲೆ 10% ರಿಯಾಯಿತಿ
                  subline: ಈ ವಾರ ಮಾತ್ರ
                  headlineEn: 10% off milk and butter
                  sublineEn: This week only
                  tint: green
                  storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z1
              outcomes: []
              failure: null
      default: *problem
/v1/biz/businesses/{bid}/stores/{sid}/ai/banner-copy/drafts/{draftId}/confirm:
  parameters: *draft
  post:
    operationId: confirmBannerCopyDraft
    tags: [ai]
    summary: Pick one banner option
    description: >-
      The store's owner and managers. At most one line `accepted` or `edited` (with the copy); the
      others discarded. Answers the picked copy for the banner editor (`POST {S}/banners`); it
      publishes nothing. Idempotent. A draft not ready is `409 invalid_transition`.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/BannerCopyConfirmRequest
          example:
            lines:
              - {lineId: l1, outcome: accepted}
              - {lineId: l2, outcome: discarded}
              - {lineId: l3, outcome: discarded}
    responses:
      "200":
        description: The outcomes and the picked copy
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/BannerCopyConfirmResult
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C0G
              status: confirmed
              lines:
                - {lineId: l1, outcome: accepted}
                - {lineId: l2, outcome: discarded}
                - {lineId: l3, outcome: discarded}
              copy: {headline: ಹಾಲು ಮತ್ತು ಬೆಣ್ಣೆ ಮೇಲೆ 10% ರಿಯಾಯಿತಿ, subline: ಈ ವಾರ ಮಾತ್ರ, tint: green, storeItemId: 01JB0SA1T2E3M4S5H6D7X8Y9Z1}
      default: *problem
# W3-13 (admin AI, AI-A1, A2, A3): each feature has its three draft endpoints under
# `/v1/admin/ai/<feature>`. Only the admin who created a draft reads and confirms it (another
# admin's draft is the common 404). A route takes the same check as the screen it helps (A-08
# catalogue review, A-14 tickets, A-13 risk). The confirm applies only what the admin sent,
# through the same writer as the screen's own buttons, re-checked as if typed by hand (11 §1
# rule 1). A feature is the common 404 while its flag is off or the model key is missing.
/v1/admin/ai/catalogue-cleanup/drafts:
  post:
    operationId: createCatalogueCleanupDraft
    tags: [ai]
    summary: Suggest a clean-up for a pending product (AI-A1)
    description: >-
      Catalogue reviewers and admins (A-08). `{pendingId}` of a product waiting in the review queue.
      Answers 202; in the background the model suggests normalised fields, the duplicate to merge it
      into (only from the queue's own look-alike candidates) and the category's names in the five
      languages. One call against the platform's daily AI cap (`429 ai_daily_cap_reached`).
    x-idempotency: required
    x-problems: [ai_daily_cap_reached]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/CatalogueCleanupDraftRequest
          example: {pendingId: 01JB3C0A1T2A3M4P5G6V7E8P9D}
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB3C1D2R3A4F5T6C7A8T9A0A, status: processing}
      default: *problem
/v1/admin/ai/catalogue-cleanup/drafts/{draftId}:
  parameters: &adminDraft
    - name: draftId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getCatalogueCleanupDraft
    tags: [ai]
    summary: A catalogue clean-up draft
    description: >-
      The admin who created it. Up to three lines: `normalise` (the fields to set), `duplicate` (the
      product to merge into, with a reason) and `categoryNames` (the five names); each is null when
      the model had nothing to add. `canApply` is false for a line the caller may not confirm
      (changing fields and category names is for admins; a catalogue reviewer may merge).
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/CatalogueCleanupDraft
            example:
              draftId: 01JB3C1D2R3A4F5T6C7A8T9A0A
              feature: catalogue_cleanup
              status: ready
              promptVersion: catalogue_cleanup/prompt@1
              createdAt: "2026-10-26T05:30:00Z"
              pendingId: 01JB3C0A1T2A3M4P5G6V7E8P9D
              normalise:
                lineId: l1
                name: Amul Taaza Toned Milk
                brandName: Amul
                variant: Toned
                packSize: 500
                unit: ml
                categoryId: 01JB0CAT1D2A3K4R5Y6M7N8P9K
                categoryName: Dairy
                canApply: true
              duplicate:
                lineId: l2
                productId: 01JB0PR0D1V2C3T4A5M6W7X8T9
                productName: Amul Taaza Toned Milk 500 ml
                similarity: 0.82
                reason: Same brand, variant and pack size; only the spelling differs.
                canApply: true
              categoryNames: null
              outcomes: []
              failure: null
      default: *problem
/v1/admin/ai/catalogue-cleanup/drafts/{draftId}/confirm:
  parameters: *adminDraft
  post:
    operationId: confirmCatalogueCleanupDraft
    tags: [ai]
    summary: Apply the accepted clean-up
    description: >-
      The admin who created it. `accepted` or `edited` applies a line exactly as A-08's own buttons
      would: `normalise` edits the pending product, `duplicate` merges it into the product,
      `categoryNames` renames the category, each audited. Sending both `normalise` and `duplicate`
      as accepted or edited is `422` (merge or edit, not both). A line the caller may not apply is
      `not_permitted` and the draft stays open. `discarded` changes nothing. Idempotent.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/CatalogueCleanupConfirmRequest
          example:
            lines:
              - {lineId: l1, outcome: discarded}
              - {lineId: l2, outcome: accepted}
    responses:
      "200":
        description: The outcome
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiConfirmResult
            example:
              draftId: 01JB3C1D2R3A4F5T6C7A8T9A0A
              status: confirmed
              lines:
                - {lineId: l1, outcome: discarded}
                - {lineId: l2, outcome: accepted}
      default: *problem
/v1/admin/ai/ticket-triage/drafts:
  post:
    operationId: createTicketTriageDraft
    tags: [ai]
    summary: Suggest a triage and a reply for a ticket (AI-A2)
    description: >-
      Support and admins (A-14). `{ticketId}` of a ticket that is not closed. Answers 202; in the
      background the model suggests a category, a priority and the order the ticket is about, a
      summary of a long thread and a reply from the order's timeline. The model sees the thread
      scrubbed of phones, codes and addresses, never internal notes or names. One call against the
      platform's daily AI cap (`429 ai_daily_cap_reached`).
    x-idempotency: required
    x-problems: [ai_daily_cap_reached]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/TicketTriageDraftRequest
          example: {ticketId: 01JB3T1C2K3E4T5S6V7P8P9Q0R}
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB3T2R3J4A5G6E7D8R9A0F1T, status: processing}
      default: *problem
/v1/admin/ai/ticket-triage/drafts/{draftId}:
  parameters: *adminDraft
  get:
    operationId: getTicketTriageDraft
    tags: [ai]
    summary: A ticket triage draft
    description: >-
      The admin who created it. Up to three lines: `classify` (category, priority, linked order),
      `summary` (only for a thread of several messages) and `reply` (a draft for the agent to edit);
      each is null when there is nothing to suggest.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/TicketTriageDraft
            example:
              draftId: 01JB3T2R3J4A5G6E7D8R9A0F1T
              feature: ticket_triage
              status: ready
              promptVersion: ticket_triage/prompt@1
              createdAt: "2026-10-26T05:30:00Z"
              ticketId: 01JB3T1C2K3E4T5S6V7P8P9Q0R
              classify:
                lineId: l1
                category: order
                priority: high
                orderId: 01JB0RD1E2R3S4A5M6P7N8E9X0
                orderNumber: TZ-104233
                reason: The customer says order TZ-104233 was collected but not received.
              summary: null
              reply:
                lineId: l3
                text: Sorry about this. Order TZ-104233 shows as collected at 6:10 pm; we are checking with the shop and will update you.
              outcomes: []
              failure: null
      default: *problem
/v1/admin/ai/ticket-triage/drafts/{draftId}/confirm:
  parameters: *adminDraft
  post:
    operationId: confirmTicketTriageDraft
    tags: [ai]
    summary: Apply the accepted triage and send the reply
    description: >-
      The admin who created it. `classify` accepted or edited sets the ticket's category, priority
      (the SLA moves as for A-14's own priority change) and linked order (only an order of the
      ticket's opener), audited. `reply` accepted or edited sends the reply exactly as the agent's
      own reply. `summary` changes nothing; its outcome is kept as feedback. `discarded` changes
      nothing. A closed ticket is `409 invalid_transition`. Idempotent.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/TicketTriageConfirmRequest
          example:
            lines:
              - lineId: l1
                outcome: edited
                value: {category: order, priority: urgent, orderId: 01JB0RD1E2R3S4A5M6P7N8E9X0}
              - lineId: l3
                outcome: edited
                value: {text: Sorry about this. We are checking with the shop and will update you today.}
    responses:
      "200":
        description: The outcome
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiConfirmResult
            example:
              draftId: 01JB3T2R3J4A5G6E7D8R9A0F1T
              status: confirmed
              lines:
                - {lineId: l1, outcome: edited}
                - {lineId: l3, outcome: edited}
      default: *problem
/v1/admin/ai/risk-summary/drafts:
  post:
    operationId: createRiskSummaryDraft
    tags: [ai]
    summary: Explain a risk flag's evidence (AI-A3)
    description: >-
      Support and admins (A-13). `{flagId}` of a risk flag. Answers 202; in the background the model
      writes a short summary of what the rule counted. Every number in it must be one of the flag's
      own (its facts, score and history counts), or the draft fails as `grounding` (D-230). One call
      against the platform's daily AI cap (`429 ai_daily_cap_reached`).
    x-idempotency: required
    x-problems: [ai_daily_cap_reached]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/RiskSummaryDraftRequest
          example: {flagId: 01JB3R1F2M3A4G5R6J7S8K9A0B}
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB3R2S3V4M5M6A7R8Y9D0R1F, status: processing}
      default: *problem
/v1/admin/ai/risk-summary/drafts/{draftId}:
  parameters: *adminDraft
  get:
    operationId: getRiskSummaryDraft
    tags: [ai]
    summary: A risk summary draft
    description: The admin who created it. One line, the summary.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/RiskSummaryDraft
            example:
              draftId: 01JB3R2S3V4M5M6A7R8Y9D0R1F
              feature: risk_summary
              status: ready
              promptVersion: risk_summary/prompt@1
              createdAt: "2026-10-26T05:30:00Z"
              flagId: 01JB3R1F2M3A4G5R6J7S8K9A0B
              lines:
                - {lineId: l1, text: The store had 6 pickup-code lockouts against a limit of 3 in a day. Its score is 70 and it has 2 earlier flags.}
              outcomes: []
              failure: null
      default: *problem
/v1/admin/ai/risk-summary/drafts/{draftId}/confirm:
  parameters: *adminDraft
  post:
    operationId: confirmRiskSummaryDraft
    tags: [ai]
    summary: Attach the summary to the flag
    description: >-
      The admin who created it. `accepted` or `edited` attaches the summary to the flag in the audit
      log (`risk.flag_summary`); an edited one may hold only the flag's own numbers. It does not
      clear, confirm or change the flag. `discarded` attaches nothing. Idempotent.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/RiskSummaryConfirmRequest
          example:
            lines:
              - {lineId: l1, outcome: accepted}
    responses:
      "200":
        description: The outcome
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiConfirmResult
            example:
              draftId: 01JB3R2S3V4M5M6A7R8Y9D0R1F
              status: confirmed
              lines:
                - {lineId: l1, outcome: accepted}
      default: *problem
# W3-12 (consumer AI, AI-C1, C2, C5; D-101, D-110): the signed-in customer's own helpers under
# /v1/me/ai. Each is the common 404 while its flag is off or its provider key is missing, and
# each call counts against the customer's daily AI cap (`ai_daily_calls_customer`). List parse
# is a draft confirmed line by line; voice search and search assist keep nothing (no draft, no
# audio, no transcript, no query text; 11 §1 rule 11). The features read is D-231.
/v1/me/ai/features:
  get:
    operationId: getMyAiFeatures
    tags: [ai]
    summary: Which customer AI helpers are on
    description: >-
      Signed-in customer. One flag per W3-12 helper (on only while its switch is on and its provider
      key is set), so the app shows or hides the "just ask" paste and voice help (C-22), the mic
      (C-23) and search assist (C-05), and the recording limits. Counts nothing against the cap.
    responses:
      "200":
        description: The features
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiCustomerFeatures
            example:
              listParse: true
              voiceSearch: true
              searchAssist: true
              maxAudioSeconds: 15
              maxAudioBytes: 1048576
              audioTypes: [audio/webm, audio/ogg, audio/wav, audio/mpeg, audio/mp4]
      default: *problem
/v1/me/ai/list-parse/drafts:
  post:
    operationId: createListParseDraft
    tags: [ai]
    summary: Turn a typed, pasted or spoken list into basket lines (AI-C1)
    description: >-
      Signed-in customer. `{text}` (at most 2000 characters, any of the five languages or mixed).
      Answers 202; the model splits it into basket lines (item words and pack as written, and a
      quantity) in the background, and the draft turns ready or failed. Nothing is saved to a
      basket and nothing is searched (D-110). The text is not stored: the draft keeps only its
      lines. One call against the customer's daily AI cap (`429 ai_daily_cap_reached`).
    x-idempotency: required
    x-problems: [ai_daily_cap_reached]
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/ListParseDraftRequest
          example: {text: '1 kg atta, 2 Nandini milk, Dolo 650'}
    responses:
      "202":
        description: Accepted for processing
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/AiDraftCreated
            example: {draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C1A, status: processing}
      default: *problem
/v1/me/ai/list-parse/drafts/{draftId}:
  parameters: &meDraft
    - name: draftId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  get:
    operationId: getListParseDraft
    tags: [ai]
    summary: A list parse draft
    description: The customer who made it (another customer's is 404). The lines to accept, edit or discard.
    responses:
      "200":
        description: The draft
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/ListParseDraft
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C1A
              feature: list_parse
              status: ready
              promptVersion: list_parse/prompt@1
              createdAt: "2026-10-26T05:30:00Z"
              lines:
                - {lineId: l1, text: atta 1 kg, quantity: 1}
                - {lineId: l2, text: Nandini milk, quantity: 2}
                - {lineId: l3, text: Dolo 650, quantity: 1}
              outcomes: []
              failure: null
      default: *problem
/v1/me/ai/list-parse/drafts/{draftId}/confirm:
  parameters: *meDraft
  post:
    operationId: confirmListParseDraft
    tags: [ai]
    summary: Take the confirmed lines into the basket editor
    description: >-
      The customer who made it. Every line once: `accepted`, `edited` (with the text and quantity)
      or `discarded`. Answers the outcomes and `basketLines`, the accepted and edited lines only (a
      discarded line is dropped), for the basket editor. Confirm saves no basket and runs no search:
      the customer saves the basket and searches it themselves (BSK-15). Idempotent. A draft not
      ready is `409 invalid_transition`.
    x-idempotency: required
    x-money: true
    parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/ListParseConfirmRequest
          example:
            lines:
              - {lineId: l1, outcome: accepted}
              - lineId: l2
                outcome: edited
                value: {text: Nandini toned milk 500 ml, quantity: 2}
              - {lineId: l3, outcome: discarded}
    responses:
      "200":
        description: The outcome and the lines for the basket
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/ListParseConfirmResult
            example:
              draftId: 01JB2Q7Z8M3V6Y4K2T9W5R1C1A
              status: confirmed
              lines:
                - {lineId: l1, outcome: accepted}
                - {lineId: l2, outcome: edited}
                - {lineId: l3, outcome: discarded}
              basketLines:
                - {lineId: l1, text: atta 1 kg, quantity: 1}
                - {lineId: l2, text: Nandini toned milk 500 ml, quantity: 2}
      default: *problem
/v1/me/ai/voice-search:
  post:
    operationId: voiceSearch
    tags: [ai]
    summary: Speak a search (AI-C5)
    description: >-
      Signed-in customer. A multipart form with `audio` (one recording of at most 15 s: audio/webm,
      audio/ogg, audio/wav, audio/mpeg or audio/mp4, at most 1 MB; longer is `422 validation_failed`
      `body.audio: too_long`) and an optional `language` (absent detects it). Answers the transcript
      for the search box and the refine chips read from it. It never searches: the app fills the box
      and the customer searches (`GET /v1/discover/search?source=voice`). Nothing is kept: no draft,
      no audio, no transcript, and no log line or trace carries either (ASK-16). One call against the
      customer's daily AI cap (`429 ai_daily_cap_reached`); a speech provider failure is
      `503 service_unavailable` (C-23 hides the mic for the session). Takes no Idempotency-Key, so
      no answer is cached with its transcript.
    x-upload: true
    x-idempotency: none
    x-problems: [ai_daily_cap_reached]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../schemas/ai.yaml#/VoiceSearchUpload
          example:
            audio: '<15 s of audio/webm>'
    responses:
      "200":
        description: The transcript and its chips
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/VoiceSearchResult
            example:
              transcript: amul butter under 60 rupees
              language: en
              chips:
                - {kind: maxPrice, value: '6000', text: under 60 rupees}
      default: *problem
/v1/me/ai/search-assist:
  post:
    operationId: searchAssist
    tags: [ai]
    summary: Suggest refine chips for a search sentence (AI-C2)
    description: >-
      Signed-in customer, called by the app only after the results of a search with `refineHint`
      have rendered (D-101). `{q}` as searched. Answers suggestion chips of the allowed kinds (a top
      price, open now, pickup, delivery, offers, near me, a brand in the master catalogue) and the
      cleaned `query`; nothing applies until the customer taps one. On a model timeout (3 s), a
      provider error or output that fails validation it is `204` and the app shows nothing; at the
      daily cap `429 ai_daily_cap_reached`. Stores nothing (no draft, no query text) and never
      touches search. Takes no Idempotency-Key.
    x-idempotency: none
    x-problems: [ai_daily_cap_reached]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ai.yaml#/SearchAssistRequest
          example: {q: something for a headache that is open now}
    responses:
      "200":
        description: Suggestions
        content:
          application/json:
            schema:
              $ref: ../schemas/ai.yaml#/SearchAssistResult
            example:
              query: headache tablet
              chips:
                - {kind: openNow, value: null, text: open now}
      "204":
        description: Nothing to suggest (timeout, provider error, invalid output, or no chip)
      default: *problem
