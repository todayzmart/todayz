# Paths: domain "admin-users" (owner W3-05): A-18 admin users and roles (04 §2.7, D-64).
#
# `super_admin` only. Reads are admin.users.view; invite, change and the
# authenticator reset are admin.users.manage, which needs a fresh step-up
# (`403 step_up_required` otherwise). Every change is audited with its reason.
/v1/admin/users:
  get:
    operationId: listAdminUsers
    tags: [admin-users]
    summary: Admin accounts, newest first
    description: "`status` defaults to `active`."
    parameters:
      - name: status
        in: query
        schema:
          $ref: ../schemas/admin-users.yaml#/AdminUserStatus
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: Admin accounts
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUserList
            example:
              items:
                - &admin
                  id: 01JB0SAD1A2B3C4D5E6F7G8H9J
                  name: Meera
                  phoneMasked: "90•••••311"
                  roles: [support]
                  status: active
                  totpEnrolled: true
                  createdBy: 01JB0SAD0A2B3C4D5E6F7G8H9J
                  createdByName: Ravi
                  createdAt: "2026-10-20T09:30:00Z"
                  disabledAt: null
                  lastActiveAt: "2026-10-25T10:12:00Z"
                  version: 1
              nextCursor: null
              serverNow: "2026-10-25T11:00:00Z"
      default: &problem
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: inviteAdminUser
    tags: [admin-users]
    summary: Give a phone number admin access with roles (step-up, audited)
    description: >-
      A POST body so the phone never sits in a URL. The person signs in with an SMS code to that
      number and sets up their authenticator on first sign-in. A number that already has an account
      (a customer or a shop) keeps it and gains admin access; one that is already an admin is
      `409 conflict`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-users.yaml#/AdminUserInvite
          example:
            phone: "9000000311"
            name: Meera
            roles: [support]
            reason: Joins the support team on Monday
    responses:
      "201":
        description: The new admin
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUser
            example:
              <<: *admin
              totpEnrolled: false
              lastActiveAt: null
      default: *problem
/v1/admin/users/{adminId}:
  parameters: &adminParam
    - name: adminId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  patch:
    operationId: updateAdminUser
    tags: [admin-users]
    summary: Change an admin's roles, or disable or re-enable them (step-up, audited)
    description: >-
      Disabling ends every admin session the person has. Nobody changes their own roles or status, and
      no change may leave the platform without an active `super_admin`: both are
      `409 invalid_transition`. A stale `version` is `409 conflict`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-users.yaml#/AdminUserChange
          example:
            roles: [support, catalogue]
            version: 1
            reason: Also reviews catalogue suggestions from this week
    responses:
      "200":
        description: The admin after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUser
            example:
              <<: *admin
              roles: [support, catalogue]
              version: 2
      default: *problem
/v1/admin/users/{adminId}/reset-totp:
  parameters: *adminParam
  post:
    operationId: resetAdminUserTotp
    tags: [admin-users]
    summary: Clear an admin's authenticator and recovery codes (step-up, audited)
    description: >-
      For a lost phone. Every admin session the person has ends, and their next sign-in sets up a new
      authenticator. Nobody resets their own (`409 invalid_transition`).
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-users.yaml#/AdminUserTOTPReset
          example:
            reason: Lost her phone; called from the office line
    responses:
      "200":
        description: The admin after the reset
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUser
            example:
              <<: *admin
              totpEnrolled: false
              version: 2
      default: *problem
