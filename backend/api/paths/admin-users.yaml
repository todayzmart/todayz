# Paths: domain "admin-users" (owner W3-05): A-18 admin users and roles (04 §2.7, D-64).
#
# `super_admin` only. Reads are admin.users.view; invite, change and the
# sign-in unlock are admin.users.manage, which needs a fresh SMS step-up
# (D-264; `403 step_up_required` otherwise). Every change is audited with its
# reason.
/v1/admin/users:
  get:
    operationId: listAdminUsers
    tags: [admin-users]
    summary: Admin accounts, newest first
    description: "`status` defaults to `active`."
    parameters:
      - name: status
        in: query
        schema:
          $ref: ../schemas/admin-users.yaml#/AdminUserStatus
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: Admin accounts
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUserList
            example:
              items:
                - &admin
                  id: 01JB0SAD1A2B3C4D5E6F7G8H9J
                  name: Meera
                  phoneMasked: "90•••••311"
                  roles: [support]
                  status: active
                  createdBy: 01JB0SAD0A2B3C4D5E6F7G8H9J
                  createdByName: Ravi
                  createdAt: "2026-10-20T09:30:00Z"
                  disabledAt: null
                  lastActiveAt: "2026-10-25T10:12:00Z"
                  signInLockedUntil: null
                  version: 1
              nextCursor: null
              serverNow: "2026-10-25T11:00:00Z"
      default: &problem
        $ref: ../common/responses.yaml#/Problem
  post:
    operationId: inviteAdminUser
    tags: [admin-users]
    summary: Give a phone number admin access with roles (step-up, audited)
    description: >-
      A POST body so the phone never sits in a URL. The person signs in with an SMS code to that
      number (no authenticator, D-264). A number that already has an account
      (a customer or a shop) keeps it and gains admin access; one that is already an admin is
      `409 conflict`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-users.yaml#/AdminUserInvite
          example:
            phone: "9000000311"
            name: Meera
            roles: [support]
            reason: Joins the support team on Monday
    responses:
      "201":
        description: The new admin
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUser
            example:
              <<: *admin
              lastActiveAt: null
      default: *problem
/v1/admin/users/{adminId}:
  parameters: &adminParam
    - name: adminId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/Ulid
  patch:
    operationId: updateAdminUser
    tags: [admin-users]
    summary: Change an admin's roles, or disable or re-enable them (step-up, audited)
    description: >-
      Disabling ends every admin session the person has. Nobody changes their own roles or status, and
      no change may leave the platform without an active `super_admin`: both are
      `409 invalid_transition`. A stale `version` is `409 conflict`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-users.yaml#/AdminUserChange
          example:
            roles: [support, catalogue]
            version: 1
            reason: Also reviews catalogue suggestions from this week
    responses:
      "200":
        description: The admin after the change
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUser
            example:
              <<: *admin
              roles: [support, catalogue]
              version: 2
      default: *problem
/v1/admin/users/{adminId}/unlock-sign-in:
  parameters: *adminParam
  post:
    operationId: unlockAdminSignIn
    tags: [admin-users]
    summary: Lift the lock on an admin's sign-in after too many wrong codes (step-up, audited)
    description: >-
      After `admin_signin_max_failures` wrong sign-in codes within `admin_signin_failure_window_hours`
      the number's admin sign-in is locked for `admin_signin_lock_hours` (D-264, 01 §2). Another
      super admin can lift it here; the count of wrong codes starts again. Nobody unlocks their own,
      and an admin whose sign-in is not locked cannot be unlocked: both `409 invalid_transition`.
    x-idempotency: none
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/admin-users.yaml#/AdminSignInUnlock
          example:
            reason: Mistyped codes on a new phone; called from the office line
    responses:
      "200":
        description: The admin after the unlock
        content:
          application/json:
            schema:
              $ref: ../schemas/admin-users.yaml#/AdminUser
            example:
              <<: *admin
      default: *problem
