# Problem codes: domain "auth" (owner W1-01; 04 §1.4 D-91 table, 02 §3).
#
# Same shape as common.yaml. A wrong OTP answers the common `unauthorized` (401)
# with `extensions.attemptsLeft` (docs/qa/W1-01/REPORT.md, Questions). A wrong
# code on a signed-in (bearer) route, where a 401 would read as "the access
# token is bad", is `code_invalid` (422) with `extensions.attemptsLeft`: the
# admin SMS step-up (D-264) and the step-up OTP of DELETE /v1/me (phase B).
domain: auth
problems:
  - code: otp_locked
    status: 429
    i18n: problems.otp_locked
    title: Too many wrong codes; ask for a new one
  - code: otp_expired
    status: 401
    i18n: problems.otp_expired
    title: This code has expired; ask for a new one
  - code: account_blocked
    status: 403
    i18n: problems.account_blocked
    title: This account is blocked
  - code: step_up_required
    status: 403
    i18n: problems.step_up_required
    title: Confirm with the code we send to your phone to continue
  - code: code_invalid
    status: 422
    i18n: problems.code_invalid
    title: That code is not right
  - code: signin_locked
    status: 429
    i18n: problems.signin_locked
    title: Admin sign-in for this number is locked; try again later or ask another super admin to unlock it
  - code: sign_in_method_changed
    status: 409
    i18n: problems.sign_in_method_changed
    title: The sign-in method changed; read GET /v1/auth/config and start again
