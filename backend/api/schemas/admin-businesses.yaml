# Schemas: domain "admin-businesses" (owner W3-05): A-03 Businesses, the KYC queue (04 §2.7, 01 §3, D-40, D-44).
# KYC values come back as their last 4 characters only; a full value is one reveal call, audited and never
# cached. Staff phones are masked as in 01 R-16.2.
AdminBusinessStatus:
  type: string
  description: "01 §3: draft, submitted, then verified, needs_info or rejected; an admin may suspend and reinstate."
  enum: [draft, submitted, needs_info, verified, rejected, suspended]
AdminBusinessChange:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    reason:
      type: string
      description: Why, 1 to 500 characters. Kept in the audit log.
      minLength: 1
      maxLength: 500
AdminBusinessVerify:
  type: object
  additionalProperties: false
  properties:
    note:
      type: string
      description: Optional, kept in the audit log.
      minLength: 1
      maxLength: 500
AdminInfoField:
  type: string
  description: A part of the application the owner must fix; the business app names it in the shop's words.
  enum: [brandName, legalName, categoryId, pan, gstin, documents, stores, city, pincode, location, hours, phone]
AdminBusinessInfoRequest:
  type: object
  additionalProperties: false
  required: [fields, note]
  properties:
    fields:
      type: array
      minItems: 1
      maxItems: 12
      uniqueItems: true
      items: {$ref: ./admin-businesses.yaml#/AdminInfoField}
    note:
      type: string
      description: What to fix, in words the owner sees on the business app, 1 to 500 characters.
      minLength: 1
      maxLength: 500
AdminKycField:
  type: string
  enum: [pan, gstin, upi, bank]
AdminKycRevealRequest:
  type: object
  additionalProperties: false
  required: [field]
  properties:
    field: {$ref: ./admin-businesses.yaml#/AdminKycField}
AdminKycReveal:
  type: object
  additionalProperties: false
  required: [field, value]
  properties:
    field: {$ref: ./admin-businesses.yaml#/AdminKycField}
    value:
      type: string
      description: "The full value. Shown once; the response is `Cache-Control: no-store`."
      maxLength: 64
AdminKycReviewRequest:
  type: object
  additionalProperties: false
  required: [decision]
  properties:
    decision:
      type: string
      enum: [verified, rejected]
    note:
      type: string
      description: Required to reject; kept as the KYC note the owner sees.
      minLength: 1
      maxLength: 500
AdminDocumentReviewRequest:
  type: object
  additionalProperties: false
  required: [decision]
  properties:
    decision:
      type: string
      enum: [accepted, rejected]
    reason:
      type: string
      description: Required to reject; the owner sees it.
      minLength: 1
      maxLength: 500
AdminBusinessSummary:
  type: object
  additionalProperties: false
  required: [id, brandName, legalName, status, city, storeCount, submittedAt, createdAt]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    brandName: {type: string, maxLength: 80}
    legalName:
      type: [string, 'null']
      maxLength: 120
    status: {$ref: ./admin-businesses.yaml#/AdminBusinessStatus}
    city:
      type: [string, 'null']
      description: The city of the business's first store.
      maxLength: 80
    storeCount: {type: integer, minimum: 0}
    submittedAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
    createdAt: {$ref: ./common.yaml#/Timestamp}
AdminBusinessList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, serverNow]
  properties:
    items:
      type: array
      maxItems: 100
      items: {$ref: ./admin-businesses.yaml#/AdminBusinessSummary}
    nextCursor: {$ref: ./common.yaml#/NextCursor}
    serverNow: {$ref: ./common.yaml#/ServerNow}
AdminKyc:
  type: object
  description: "`missing` with every value null until the owner starts KYC."
  additionalProperties: false
  required: [status, legalName, panLast4, gstinLast4, upiLast4, bankLast4, bankIfsc, notes, verifiedAt]
  properties:
    status:
      type: string
      enum: [missing, submitted, verified, rejected]
    legalName:
      type: [string, 'null']
      maxLength: 120
    panLast4:
      type: [string, 'null']
      maxLength: 4
    gstinLast4:
      type: [string, 'null']
      maxLength: 4
    upiLast4:
      type: [string, 'null']
      maxLength: 4
    bankLast4:
      type: [string, 'null']
      maxLength: 4
    bankIfsc:
      type: [string, 'null']
      maxLength: 11
    notes:
      type: [string, 'null']
      maxLength: 1000
    verifiedAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
AdminBusinessStore:
  type: object
  additionalProperties: false
  required: [id, name, status, locality, city, liveAt, createdAt]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    name: {type: string, maxLength: 80}
    status:
      type: string
      enum: [draft, pending_review, live, paused, suspended]
    locality:
      type: [string, 'null']
      maxLength: 80
    city:
      type: [string, 'null']
      maxLength: 80
    liveAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
    createdAt: {$ref: ./common.yaml#/Timestamp}
AdminBusinessStaff:
  type: object
  additionalProperties: false
  required: [id, name, role, status, phoneMasked]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    name:
      type: [string, 'null']
      maxLength: 80
    role:
      type: string
      enum: [owner, manager, cashier]
    status:
      type: string
      enum: [invited, active]
    phoneMasked:
      type: [string, 'null']
      maxLength: 20
AdminBusinessDocument:
  type: object
  additionalProperties: false
  required: [id, kind, contentType, sizeBytes, storeId, status, rejectReason, createdAt, reviewedAt]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    kind:
      type: string
      enum: [pan, gst, shop_photo, storefront, license, other]
    contentType:
      type: string
      enum: [image/jpeg, image/png, image/webp, application/pdf]
    sizeBytes: {type: integer, format: int64, minimum: 1}
    storeId:
      type: [string, 'null']
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    status:
      type: string
      enum: [pending, uploaded, accepted, rejected]
    rejectReason:
      type: [string, 'null']
      maxLength: 500
    createdAt: {$ref: ./common.yaml#/Timestamp}
    reviewedAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
AdminBusiness:
  type: object
  additionalProperties: false
  required: [id, brandName, legalName, status, needsInfoFields, needsInfoNote, submittedAt, verifiedAt, checkStatus, checkedAt, checkNote, createdAt, kyc, stores, staff, documents, serverNow]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    brandName: {type: string, maxLength: 80}
    legalName:
      type: [string, 'null']
      maxLength: 120
    status: {$ref: ./admin-businesses.yaml#/AdminBusinessStatus}
    needsInfoFields:
      type: array
      maxItems: 20
      items: {type: string, maxLength: 64}
    needsInfoNote:
      type: [string, 'null']
      maxLength: 500
    submittedAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
    verifiedAt:
      type: [string, 'null']
      description: When the business went live (D-274 sets it on submit; no admin approves it).
      format: date-time
      maxLength: 40
    checkStatus: {$ref: ./admin-businesses.yaml#/AdminCheckStatus}
    checkedAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
    checkNote:
      type: [string, 'null']
      description: The check's note, or the reject's reason.
      maxLength: 500
    createdAt: {$ref: ./common.yaml#/Timestamp}
    kyc: {$ref: ./admin-businesses.yaml#/AdminKyc}
    stores:
      type: array
      maxItems: 100
      items: {$ref: ./admin-businesses.yaml#/AdminBusinessStore}
    staff:
      type: array
      maxItems: 100
      items: {$ref: ./admin-businesses.yaml#/AdminBusinessStaff}
    documents:
      type: array
      maxItems: 100
      items: {$ref: ./admin-businesses.yaml#/AdminBusinessDocument}
    serverNow: {$ref: ./common.yaml#/ServerNow}
AdminCheckStatus:
  type: string
  description: >-
    The shop check (D-274): a business sells from sign-up and is `unchecked` until a field agent, admin or
    super_admin checks it (`checked`, which releases its payouts) or rejects it (`rejected`, which hides it).
  enum: [unchecked, checked, rejected]
AdminShopCheckStore:
  type: object
  additionalProperties: false
  required: [id, name, status, addressLine1, locality, city, pincode, lat, lng, liveAt]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    name: {type: string, maxLength: 80}
    status:
      type: string
      enum: [draft, pending_review, live, paused, suspended]
    addressLine1:
      type: [string, 'null']
      maxLength: 200
    locality:
      type: [string, 'null']
      maxLength: 80
    city:
      type: [string, 'null']
      maxLength: 80
    pincode:
      type: [string, 'null']
      maxLength: 6
    lat:
      type: [number, 'null']
      format: double
      minimum: -90
      maximum: 90
    lng:
      type: [number, 'null']
      format: double
      minimum: -180
      maximum: 180
    liveAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
AdminShopCheckPhoto:
  type: object
  additionalProperties: false
  required: [id, kind, storeId, status, previewUrl, createdAt]
  description: A shop photo. `previewUrl` is a presigned GET valid for 15 minutes; null while storage is not configured.
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    kind:
      type: string
      enum: [shop_photo, storefront]
    storeId:
      type: [string, 'null']
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    status:
      type: string
      enum: [uploaded, accepted, rejected]
    previewUrl:
      type: [string, 'null']
      maxLength: 2048
    createdAt: {$ref: ./common.yaml#/Timestamp}
AdminShopCheck:
  type: object
  additionalProperties: false
  required: [id, brandName, legalName, status, checkStatus, checkNote, checkedAt, category, liveAt, createdAt, byFieldAgent, kycStatus, stores, photos]
  description: >-
    One shop for the check (D-274): its details, stores with the map pin, and photos. No phone numbers; KYC
    shows only its status (the values stay on A-03 for admins).
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    brandName: {type: string, maxLength: 80}
    legalName:
      type: [string, 'null']
      maxLength: 120
    status: {$ref: ./admin-businesses.yaml#/AdminBusinessStatus}
    checkStatus: {$ref: ./admin-businesses.yaml#/AdminCheckStatus}
    checkNote:
      type: [string, 'null']
      description: The check's note, or the reject's reason.
      maxLength: 500
    checkedAt:
      type: [string, 'null']
      format: date-time
      maxLength: 40
    category:
      type: [string, 'null']
      description: The business category's English name.
      maxLength: 80
    liveAt:
      type: [string, 'null']
      description: When the business went live (submitted).
      format: date-time
      maxLength: 40
    createdAt: {$ref: ./common.yaml#/Timestamp}
    byFieldAgent:
      type: boolean
      description: A field agent onboarded it (A-04), rather than the owner on their own.
    kycStatus:
      type: string
      enum: [missing, submitted, verified, rejected]
    stores:
      type: array
      maxItems: 100
      items: {$ref: ./admin-businesses.yaml#/AdminShopCheckStore}
    photos:
      type: array
      maxItems: 20
      items: {$ref: ./admin-businesses.yaml#/AdminShopCheckPhoto}
AdminShopCheckList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, serverNow]
  properties:
    items:
      type: array
      maxItems: 100
      items: {$ref: ./admin-businesses.yaml#/AdminShopCheck}
    nextCursor: {$ref: ./common.yaml#/NextCursor}
    serverNow: {$ref: ./common.yaml#/ServerNow}
AdminShopRejected:
  type: object
  additionalProperties: false
  required: [shop, cancelledOrders]
  properties:
    shop: {$ref: ./admin-businesses.yaml#/AdminShopCheck}
    cancelledOrders:
      type: integer
      minimum: 0
      description: The open online orders the reject cancelled (system reason `shop_rejected`, no strike).
