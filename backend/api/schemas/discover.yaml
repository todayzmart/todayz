# Schemas: domain "discover" (owner W1-06): public store discovery and search (04 §2.3).
#
# Names are unique across every schemas/<domain>.yaml, so every schema here
# starts with `Discover`. Money is `*Paise`, ids are `Ulid`, times are
# `Timestamp`; every response carries `serverNow`. Nothing here ever carries a
# customer's location back, a store's phone or a stock count (01 §16).
DiscoverPlaceKind:
  type: string
  enum: [pincode, locality, city]
DiscoverPlace:
  type: object
  description: A PIN code, locality or city for the location picker (01 §11).
  required: [id, kind, name, pincode, city, label, lat, lng]
  properties:
    id:
      $ref: ./common.yaml#/Ulid
    kind:
      $ref: "#/DiscoverPlaceKind"
    name:
      type: string
    pincode:
      type: [string, "null"]
    city:
      type: [string, "null"]
      description: The city of a locality or PIN code; null for a city.
    label:
      type: string
      description: The text the location bar shows, e.g. "Indiranagar, Bengaluru 560038".
    lat:
      type: number
      format: double
    lng:
      type: number
      format: double
DiscoverPlaceList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/DiscoverPlace"
DiscoverPin:
  type: object
  description: One store on the StoreMap card.
  required: [storeSlug, lat, lng, open, categoryTint]
  properties:
    storeSlug:
      $ref: ./common.yaml#/Slug
    lat:
      type: number
      format: double
    lng:
      type: number
      format: double
    open:
      type: boolean
    categoryTint:
      type: [string, "null"]
      description: The design tint of the business's category (green, rose, lilac, sky, amber, peach).
DiscoverSummary:
  type: object
  description: >-
    The StoreMap card (C-03): live stores of verified businesses in the radius,
    how many are open now, the in-stock listings across them, and the pins of the
    nearest stores (at most 200; `pinsTruncated` when there are more). Clusters
    by zoom are not built yet: the app clusters the pins itself.
  required: [storesNearby, openNow, productsInRadius, pins, pinsTruncated, serverNow]
  properties:
    storesNearby:
      type: integer
      minimum: 0
    openNow:
      type: integer
      minimum: 0
    productsInRadius:
      type: integer
      minimum: 0
      description: In-stock listings across the stores (not distinct catalogue products).
    pins:
      type: array
      items:
        $ref: "#/DiscoverPin"
    pinsTruncated:
      type: boolean
    serverNow:
      $ref: ./common.yaml#/ServerNow
DiscoverStoreCard:
  type: object
  description: A shop in the list or in a search result (D-41, D-101).
  required: [storeId, storeSlug, name, locality, distanceM, open, pickup, delivery, bookable, rating, ratingCount, cashbackPct, categoryTint, photoKey]
  properties:
    storeId:
      $ref: ./common.yaml#/Ulid
      description: The id checkout and the cart use (CheckoutQuoteRequest.storeId).
    storeSlug:
      $ref: ./common.yaml#/Slug
    name:
      type: string
    locality:
      type: [string, "null"]
    distanceM:
      type: integer
      minimum: 0
      description: Metres from the search location, rounded.
    open:
      type: boolean
      description: Open at the server's time, counting holidays and a manual close.
    pickup:
      type: boolean
    delivery:
      type: boolean
      description: The store delivers (its own setting and the platform's delivery switch).
    bookable:
      type: boolean
      description: False for an In-store only store (no pickup and no delivery, D-41).
    rating:
      type: [number, "null"]
      format: double
      description: The average rating, 0 to 5; null before the first rating.
    ratingCount:
      type: integer
      minimum: 0
    cashbackPct:
      type: number
      format: double
      description: Cashback on orders as a percentage (2.5 means 2.5 %).
    categoryTint:
      type: [string, "null"]
    photoKey:
      type: [string, "null"]
      description: >-
        The shop's storefront photo's object key on the image host, once an
        admin has accepted one (D-246); null shows the initials.
DiscoverStoreList:
  type: object
  required: [items, nextCursor, serverNow]
  properties:
    items:
      type: array
      items:
        $ref: "#/DiscoverStoreCard"
    nextCursor:
      $ref: ./common.yaml#/NextCursor
    serverNow:
      $ref: ./common.yaml#/ServerNow
DiscoverUnit:
  type: string
  enum: [g, kg, ml, l, pc, pack]
DiscoverSearchItem:
  type: object
  description: One matching in-stock item of a store.
  required: [storeItemId, productId, name, variant, brand, packSize, unit, pricePaise, mrpPaise, hasOffer, inStock, confirmedAt, imageKey]
  properties:
    storeItemId:
      $ref: ./common.yaml#/Ulid
    productId:
      $ref: ./common.yaml#/Ulid
    name:
      type: string
      description: The store's local name when it set one, else the product name.
    variant:
      type: [string, "null"]
    brand:
      type: [string, "null"]
    packSize:
      type: number
      format: double
    unit:
      $ref: "#/DiscoverUnit"
    pricePaise:
      $ref: ./common.yaml#/Paise
    mrpPaise:
      type: [integer, "null"]
      minimum: 0
    hasOffer:
      type: boolean
    inStock:
      type: boolean
      description: Always true in search results; the shop page also lists items that are out of stock.
    confirmedAt:
      type: [string, "null"]
      format: date-time
      description: >-
        When the store last confirmed this item's stock (`stock_updated_at`), while
        that is within `stock_stale_after_hours`; null after that ("Stock not
        confirmed recently", D-101).
    imageKey:
      type: [string, "null"]
      description: The product image's object key on the image host, when there is one.
DiscoverBadge:
  type: string
  enum: [lowest_price, closest]
  description: At most one per result, each on at most one result of the first page (D-101).
DiscoverSearchStore:
  type: object
  description: >-
    One store with its matching items, best first. `badge` is a label only; it
    never changes the order. `deliveryFeePaise` is the fee for one unit of the
    store's first (best-matching) item (0 at or above its free-delivery threshold),
    set when the Delivery chip is on or the store only delivers, else null.
  required: [store, items, badge, deliveryFeePaise]
  properties:
    store:
      $ref: "#/DiscoverStoreCard"
    items:
      type: array
      items:
        $ref: "#/DiscoverSearchItem"
    badge:
      oneOf:
        - $ref: "#/DiscoverBadge"
        - type: "null"
    deliveryFeePaise:
      type: [integer, "null"]
      minimum: 0
DiscoverSearchSummary:
  type: object
  description: >-
    "Checked {storesChecked} shops nearby · {storesWithIt} have it · from
    ₹{minPricePaise}" (D-101). storesChecked counts every live store of a
    verified business in the radius, open or closed.
  required: [storesChecked, storesWithIt, minPricePaise]
  properties:
    storesChecked:
      type: integer
      minimum: 0
    storesWithIt:
      type: integer
      minimum: 1
    minPricePaise:
      $ref: ./common.yaml#/Paise
DiscoverChipKind:
  type: string
  enum: [maxPrice, openNow, pickup, delivery, offers, nearest, brand]
DiscoverChip:
  type: object
  description: A refine chip the parser read from the query (D-101).
  required: [kind, value, text]
  properties:
    kind:
      $ref: "#/DiscoverChipKind"
    value:
      type: [string, "null"]
      description: The filter value (paise for maxPrice, the brand slug for brand), null for the others.
    text:
      type: string
      description: The words of the query the chip came from.
DiscoverSearchResult:
  type: object
  description: >-
    Results grouped by store (01 §11). `summary` is absent when no store has it.
    `query` is the text searched after the chips were taken out.
  required: [query, results, chips, refineHint, nextCursor, serverNow]
  properties:
    query:
      type: string
    summary:
      $ref: "#/DiscoverSearchSummary"
    results:
      type: array
      items:
        $ref: "#/DiscoverSearchStore"
    chips:
      type: array
      items:
        $ref: "#/DiscoverChip"
    refineHint:
      type: boolean
      description: True when the app may offer search assist (D-101, D-231, D-238).
    nextCursor:
      $ref: ./common.yaml#/NextCursor
    serverNow:
      $ref: ./common.yaml#/ServerNow
DiscoverSuggestionKind:
  type: string
  enum: [product, brand, category]
DiscoverSuggestion:
  type: object
  required: [kind, text, productId, brandSlug, categorySlug]
  properties:
    kind:
      $ref: "#/DiscoverSuggestionKind"
    text:
      type: string
      description: What the search box fills in when the suggestion is tapped.
    productId:
      oneOf:
        - $ref: ./common.yaml#/Ulid
        - type: "null"
    brandSlug:
      type: [string, "null"]
    categorySlug:
      type: [string, "null"]
DiscoverSuggestionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/DiscoverSuggestion"
DiscoverHoursRange:
  type: object
  required: [open, close]
  properties:
    open:
      type: string
      description: IST wall-clock time, HH:MM.
    close:
      type: string
      description: IST wall-clock time, HH:MM or 24:00; at or before `open` it runs past midnight.
DiscoverHoursHoliday:
  type: object
  required: [date, ranges]
  properties:
    date:
      type: string
      format: date
    ranges:
      type: array
      items:
        $ref: "#/DiscoverHoursRange"
DiscoverHours:
  type: object
  description: The store's weekly hours (keys mon…sun) and its holidays from today on, IST (01 §3).
  required: [weekly, holidays]
  properties:
    weekly:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/DiscoverHoursRange"
    holidays:
      type: array
      items:
        $ref: "#/DiscoverHoursHoliday"
DiscoverStorePage:
  type: object
  description: >-
    The shop page (C-07): a live store of a verified business. Never the phone
    number or the stock counts. `distanceM` is set when the request carries
    `lat` and `lng`.
  required: [storeId, storeSlug, name, locality, addressLine1, addressLine2, landmark, city, pincode, lat, lng, distanceM, open, closedUntil, hours, pickup, delivery, bookable, rating, ratingCount, cashbackPct, categoryTint, photoKey, categorySlug, categoryName, deliveryFeePaise, deliveryFreeAbovePaise, deliveryMinOrderPaise, deliveryRadiusM, serverNow]
  properties:
    storeId:
      $ref: ./common.yaml#/Ulid
      description: The id checkout and the cart use (CheckoutQuoteRequest.storeId).
    storeSlug:
      $ref: ./common.yaml#/Slug
    name:
      type: string
    locality:
      type: [string, "null"]
    addressLine1:
      type: [string, "null"]
    addressLine2:
      type: [string, "null"]
    landmark:
      type: [string, "null"]
    city:
      type: [string, "null"]
    pincode:
      type: [string, "null"]
    lat:
      type: number
      format: double
    lng:
      type: number
      format: double
    distanceM:
      type: [integer, "null"]
      minimum: 0
    open:
      type: boolean
    closedUntil:
      type: [string, "null"]
      format: date-time
      description: Closed by hand until this time, while that is in the future.
    hours:
      $ref: "#/DiscoverHours"
    pickup:
      type: boolean
    delivery:
      type: boolean
    bookable:
      type: boolean
    rating:
      type: [number, "null"]
      format: double
    ratingCount:
      type: integer
      minimum: 0
    cashbackPct:
      type: number
      format: double
    categoryTint:
      type: [string, "null"]
    photoKey:
      type: [string, "null"]
      description: >-
        The shop's storefront photo's object key on the image host, once an
        admin has accepted one (D-246); null shows the initials.
    categorySlug:
      type: [string, "null"]
      description: The shop's primary category (the one `category` filters by); null when none.
    categoryName:
      type: [string, "null"]
      description: English name of `categorySlug`; null when there is none.
    deliveryFeePaise:
      $ref: ./common.yaml#/Paise
    deliveryFreeAbovePaise:
      type: [integer, "null"]
      minimum: 0
    deliveryMinOrderPaise:
      $ref: ./common.yaml#/Paise
    deliveryRadiusM:
      type: integer
      minimum: 0
    serverNow:
      $ref: ./common.yaml#/ServerNow
DiscoverStoreItemList:
  type: object
  description: A page of the shop's listed items, in stock first, then by name.
  required: [items, nextCursor, serverNow]
  properties:
    items:
      type: array
      items:
        $ref: "#/DiscoverSearchItem"
    nextCursor:
      $ref: ./common.yaml#/NextCursor
    serverNow:
      $ref: ./common.yaml#/ServerNow
# --- W3-12 substitutes (AI-C3, rule-based, D-235) ---
DiscoverSubstitutes:
  type: object
  description: What to buy instead of an out-of-stock item, at most 6 rows (D-235).
  required: [sameShop, nearby, serverNow]
  properties:
    sameShop:
      type: array
      maxItems: 3
      description: Similar in-stock items of the same shop (same category, pack within substitute_pack_tolerance_pct), best first.
      items:
        $ref: "#/DiscoverSearchItem"
    nearby:
      type: array
      maxItems: 3
      description: The same product at other shops nearby, nearest first, one item each.
      items:
        $ref: "#/DiscoverSearchStore"
    serverNow:
      $ref: ./common.yaml#/ServerNow
# --- W2-14 basket search (01 §11.4, D-110, D-111) ---
BasketSearchLine:
  type: object
  additionalProperties: false
  description: A basket line. Exactly one of `productId` and `text` (422 on `body.lines[i]` otherwise).
  required: [quantity]
  properties:
    productId:
      $ref: ./common.yaml#/Ulid
    text:
      type: string
      minLength: 1
      maxLength: 120
    quantity:
      type: integer
      minimum: 1
      maximum: 99
  oneOf:
    - required: [productId]
    - required: [text]
BasketSearchRequest:
  type: object
  additionalProperties: false
  required: [lat, lng, lines]
  properties:
    lat:
      type: number
      format: double
      minimum: 6
      maximum: 38
      description: Latitude of the search location. Never stored.
    lng:
      type: number
      format: double
      minimum: 68
      maximum: 98
      description: Longitude of the search location. Never stored.
    radius:
      type: integer
      enum: [1000, 2000, 5000, 10000, 20000]
      default: 2000
      description: 'Radius in metres: the 1, 2, 5, 10 and 20 km chips (01 §11).'
    lines:
      type: array
      minItems: 1
      maxItems: 100
      description: At most `basket_max_items` (422 on `body.lines` beyond); 100 is the setting's maximum.
      items:
        $ref: "#/BasketSearchLine"
BasketBadge:
  type: string
  enum: [has_everything, closest, lowest_price]
  description: At most one per result and each on at most one result; a label only (01 §11.4).
BasketCoveredLine:
  type: object
  description: One covered line at a store, with what "Fill cart" puts in the cart.
  required: [lineIndex, storeItemId, productId, name, variant, packSize, unit, pricePaise, mrpPaise, imageKey, quantity, lineTotalPaise, confirmedAt]
  properties:
    lineIndex:
      type: integer
      minimum: 0
    storeItemId:
      $ref: ./common.yaml#/Ulid
    productId:
      $ref: ./common.yaml#/Ulid
    name:
      type: string
      description: The store's local name when it set one, else the product name.
    variant:
      type: [string, "null"]
    packSize:
      type: number
      format: double
    unit:
      $ref: "#/DiscoverUnit"
    pricePaise:
      $ref: ./common.yaml#/Paise
    mrpPaise:
      type: [integer, "null"]
      minimum: 0
    imageKey:
      type: [string, "null"]
    quantity:
      type: integer
      minimum: 1
      maximum: 99
    lineTotalPaise:
      $ref: ./common.yaml#/Paise
      description: Price times quantity less the line's item offer.
    confirmedAt:
      type: [string, "null"]
      format: date-time
      description: As in discover search (01 §11.1); null when stock was not confirmed recently.
BasketMissingLine:
  type: object
  required: [lineIndex]
  properties:
    lineIndex:
      type: integer
      minimum: 0
BasketSearchStore:
  type: object
  description: '"{coveredCount} of {lineCount} · {distance} · ₹{total}" (01 §11.4).'
  required: [storeId, storeSlug, storeName, locality, distanceM, open, bookable, coveredCount, lineCount, totalPaise, badge, covered, missing]
  properties:
    storeId:
      $ref: ./common.yaml#/Ulid
      description: The id the cart and checkout use.
    storeSlug:
      $ref: ./common.yaml#/Slug
    storeName:
      type: string
    locality:
      type: [string, "null"]
    distanceM:
      type: integer
      minimum: 0
    open:
      type: boolean
    bookable:
      type: boolean
      description: False for an In-store only store (D-41).
    coveredCount:
      type: integer
      minimum: 0
    lineCount:
      type: integer
      minimum: 1
    totalPaise:
      $ref: ./common.yaml#/Paise
      description: The covered lines' total; a preview, checkout reprices.
    badge:
      oneOf:
        - $ref: "#/BasketBadge"
        - type: "null"
    covered:
      type: array
      items:
        $ref: "#/BasketCoveredLine"
    missing:
      type: array
      items:
        $ref: "#/BasketMissingLine"
BasketSplitPart:
  type: object
  description: One store of a split with the lines it gets (each line goes to the cheaper store).
  required: [storeId, storeSlug, storeName, distanceM, bookable, lineIndexes, totalPaise, covered]
  properties:
    storeId:
      $ref: ./common.yaml#/Ulid
    storeSlug:
      $ref: ./common.yaml#/Slug
    storeName:
      type: string
    distanceM:
      type: integer
      minimum: 0
    bookable:
      type: boolean
    lineIndexes:
      type: array
      items:
        type: integer
        minimum: 0
    totalPaise:
      $ref: ./common.yaml#/Paise
    covered:
      type: array
      items:
        $ref: "#/BasketCoveredLine"
BasketSplitSuggestion:
  type: object
  description: The suggested split across two stores (01 §11.4); the first is the one "Fill cart" fills.
  required: [stores, uncovered]
  properties:
    stores:
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: "#/BasketSplitPart"
    uncovered:
      type: array
      description: Indexes of the lines neither store covers.
      items:
        type: integer
        minimum: 0
BasketSearchSummary:
  type: object
  description: '"Checked {storesChecked} shops nearby · {storesWithAll} have everything" (01 §11.4).'
  required: [storesChecked, storesWithAll]
  properties:
    storesChecked:
      type: integer
      minimum: 0
    storesWithAll:
      type: integer
      minimum: 0
BasketSearchResult:
  type: object
  required: [summary, results, split, serverNow]
  properties:
    summary:
      $ref: "#/BasketSearchSummary"
    results:
      type: array
      items:
        $ref: "#/BasketSearchStore"
    split:
      oneOf:
        - $ref: "#/BasketSplitSuggestion"
        - type: "null"
    serverNow:
      $ref: ./common.yaml#/ServerNow
