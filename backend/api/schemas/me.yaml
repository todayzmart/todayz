# Schemas: domain "me" (owner W1-01, W2-05, W2-04): the signed-in user's profile, addresses, stream, notifications (04 §2.2).
#
# Pre-created empty by W0-04 (D-50). Fill it as a map of schema name -> JSON
# Schema; names are unique across every schemas/<domain>.yaml. Request objects
# carry `additionalProperties: false` (an unknown field is 422 validation_failed);
# an object that must stay open says `x-open-object: true`. Money is `*Paise`
# (`../schemas/common.yaml#/Paise`), ids are `Ulid`, times are `Timestamp`,
# timed responses carry `serverNow: {$ref: ./common.yaml#/ServerNow}`.
Language:
  type: string
  description: UI language (01 §1). English is the default.
  enum: [en, hi, kn, te, ta]
Me:
  type: object
  description: The signed-in user as this app sees them (04 §2.2).
  required: [id, name, preferredLang, phoneMasked, app, createdAt]
  properties:
    id:
      $ref: ./common.yaml#/Ulid
    name:
      type:
        - string
        - "null"
      maxLength: 80
    preferredLang:
      $ref: "#/Language"
    phoneMasked:
      type: string
      description: The sign-in number masked as in 01 R-16.2 (`98•••••521`). The full number is never returned.
    app:
      type: string
      description: The app this token belongs to.
      enum: [customer, business, admin]
    roles:
      type: array
      description: Admin roles (D-64); admin app only.
      items:
        type: string
    customer:
      description: Customer app only.
      oneOf:
        - $ref: "#/CustomerProfile"
        - type: "null"
    createdAt:
      $ref: ./common.yaml#/Timestamp
CustomerProfile:
  type: object
  required: [referralCode, activeOrderLimit]
  properties:
    referralCode:
      type: string
      description: This customer's own referral code (6 characters).
    activeOrderLimit:
      description: Set while no-show strikes limit the account (01 §5.4, C-21); null otherwise.
      oneOf:
        - $ref: "#/ActiveOrderLimit"
        - type: "null"
ActiveOrderLimit:
  type: object
  required: [maxActiveOrders, until, reason]
  properties:
    maxActiveOrders:
      type: integer
      minimum: 1
    until:
      $ref: ./common.yaml#/Timestamp
    reason:
      type: string
      enum: [no_show_strikes]
MePatch:
  type: object
  description: Only the fields present change. `name` null clears it.
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 80
    preferredLang:
      $ref: "#/Language"
MeDeleteRequest:
  type: object
  description: "The step-up code that confirms deleting the account (`otp/send` with `purpose: step_up`)."
  additionalProperties: false
  required: [otpRequestId, code]
  properties:
    otpRequestId:
      $ref: ./common.yaml#/Ulid
    code:
      type: string
      description: The 6-digit code from the SMS. Never logged (D-15).
      pattern: ^[0-9]{6}$
      maxLength: 6
Address:
  type: object
  description: A saved delivery address (01 §5.5, C-18). Only its owner ever sees it.
  required: [addressId, label, line1, line2, landmark, pincode, lat, lng, isDefault, updatedAt, version]
  properties:
    addressId:
      $ref: ./common.yaml#/Ulid
    label:
      type: string
      description: The customer's own name for it ("Home", "Office").
      maxLength: 40
    line1:
      type: string
      maxLength: 200
    line2:
      type:
        - string
        - "null"
      maxLength: 200
    landmark:
      type:
        - string
        - "null"
      maxLength: 120
    pincode:
      type: string
      pattern: ^[1-9][0-9]{5}$
    lat:
      type: number
      format: double
      minimum: -90
      maximum: 90
    lng:
      type: number
      format: double
      minimum: -180
      maximum: 180
    isDefault:
      type: boolean
    updatedAt:
      $ref: ./common.yaml#/Timestamp
    version:
      type: integer
      format: int32
AddressList:
  type: object
  required: [addresses]
  properties:
    addresses:
      type: array
      items:
        $ref: "#/Address"
AddressCreate:
  type: object
  additionalProperties: false
  required: [label, line1, pincode, lat, lng]
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 40
    line1:
      type: string
      minLength: 1
      maxLength: 200
    line2:
      type:
        - string
        - "null"
      maxLength: 200
    landmark:
      type:
        - string
        - "null"
      maxLength: 120
    pincode:
      type: string
      pattern: ^[1-9][0-9]{5}$
    lat:
      type: number
      format: double
      minimum: -90
      maximum: 90
    lng:
      type: number
      format: double
      minimum: -180
      maximum: 180
    isDefault:
      type: boolean
AddressPatch:
  type: object
  description: Only the fields present change. `line2` or `landmark` null clears it.
  additionalProperties: false
  minProperties: 1
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 40
    line1:
      type: string
      minLength: 1
      maxLength: 200
    line2:
      type:
        - string
        - "null"
      maxLength: 200
    landmark:
      type:
        - string
        - "null"
      maxLength: 120
    pincode:
      type: string
      pattern: ^[1-9][0-9]{5}$
    lat:
      type: number
      format: double
      minimum: -90
      maximum: 90
    lng:
      type: number
      format: double
      minimum: -180
      maximum: 180
    isDefault:
      type: boolean
