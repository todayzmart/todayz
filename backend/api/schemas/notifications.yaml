# Schemas: domain "notifications" (owner W2-05): the in-app inbox and notification
# preferences (01 §15, 04 §2.2, §2.6). The text of a notification is rendered on read, in
# the language of the request's Accept-Language (en, hi, kn, te, ta; English otherwise).
NotificationRef:
  type:
    - object
    - "null"
  description: What the notification opens, or null.
  required: [type, id]
  properties:
    type:
      type: string
      description: "order, ask, review, payout, referral, …"
      maxLength: 31
    id:
      $ref: ./common.yaml#/Ulid
Notification:
  type: object
  required: [id, kind, title, body, ref, readAt, createdAt]
  properties:
    id:
      $ref: ./common.yaml#/Ulid
    kind:
      type: string
      description: The notification kind (`order_update`, `new_order`, `order_unseen`, …).
      maxLength: 63
    title:
      type: string
      maxLength: 200
    body:
      type: string
      maxLength: 1000
    storeId:
      description: Business inbox only, the store the row is about, or null for the business.
      type:
        - string
        - "null"
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    ref:
      $ref: "#/NotificationRef"
    readAt:
      type:
        - string
        - "null"
      format: date-time
      maxLength: 40
    createdAt:
      $ref: ./common.yaml#/Timestamp
NotificationPage:
  type: object
  required: [items, nextCursor, unreadCount]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: "#/Notification"
    nextCursor:
      $ref: ./common.yaml#/NextCursor
    unreadCount:
      type: integer
      minimum: 0
NotificationReadRequest:
  type: object
  description: Mark the listed rows read, or every row (`{all:true}`). Exactly one of the two.
  additionalProperties: false
  properties:
    ids:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: ./common.yaml#/Ulid
    all:
      type: boolean
      const: true
UnreadCount:
  type: object
  required: [unreadCount]
  properties:
    unreadCount:
      type: integer
      minimum: 0
NotificationChannel:
  type: string
  description: An outside channel. The in-app inbox is always written and has no switch (01 §15).
  enum: [push, sms, whatsapp]
NotificationPref:
  type: object
  required: [kind, channel, enabled]
  additionalProperties: false
  properties:
    kind:
      type: string
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      maxLength: 63
    channel:
      $ref: "#/NotificationChannel"
    enabled:
      type: boolean
NotificationPrefs:
  type: object
  required: [items]
  properties:
    items:
      type: array
      description: Every kind the signed-in app can switch, with each of its channels.
      maxItems: 200
      items:
        $ref: "#/NotificationPref"
NotificationPrefsPatch:
  type: object
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: "#/NotificationPref"
