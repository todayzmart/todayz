# Schemas: domain "admin-audit" (owner W3-05): A-19 audit log and every screen's audit side panel (04 §2.7).
# `before` and `after` are the values the change recorded; writers never put a phone, code, token or
# address in them (internal/platform/audit).
AdminAuditEntry:
  type: object
  additionalProperties: false
  required: [id, actorKind, actorId, actorName, action, subjectType, subjectId, before, after, createdAt]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    actorKind:
      type: string
      enum: [user, staff, admin, system, device]
    actorId:
      type: [string, 'null']
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    actorName:
      type: [string, 'null']
      maxLength: 80
    action: {type: string, maxLength: 80}
    subjectType: {type: string, maxLength: 40}
    subjectId:
      type: [string, 'null']
      maxLength: 120
    before:
      type: [object, 'null']
      description: The recorded state before the change.
    after:
      type: [object, 'null']
      description: The recorded state after the change.
    createdAt: {$ref: ./common.yaml#/Timestamp}
AdminAuditList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, serverNow]
  properties:
    items:
      type: array
      maxItems: 100
      items: {$ref: '#/AdminAuditEntry'}
    nextCursor: {$ref: ./common.yaml#/NextCursor}
    serverNow: {$ref: ./common.yaml#/ServerNow}
AdminAuditSubjectType:
  type: string
  description: The subjects a screen's audit panel can show.
  enum: [order, user, store, business, review, banner, lead, platform_setting, admin_user, product, category, synonym, notification_template, payout, payout_period, credit_adjustment, risk_flag, referral, job_kind, job_run, site_marquee]
