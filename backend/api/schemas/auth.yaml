# Schemas: domain "auth" (owner W1-01): sign-in, OTP, refresh, sign-out, admin step-up (04 §2.1).
#
# Map of schema name -> JSON Schema; names are unique across every
# schemas/<domain>.yaml. Request objects carry `additionalProperties: false`.
AuthApp:
  type: string
  description: |
    The app signing in (D-14). Each app has its own session and refresh cookie:
    `customer` → `__Secure-tz_rt_c`, `business` → `__Secure-tz_rt_b`, `admin` → `__Secure-tz_rt_a`.
  enum: [customer, business, admin]
IndianMobile:
  type: string
  description: An Indian mobile number in E.164 (`+91` and 10 digits starting 6–9). Never logged (D-15).
  pattern: ^\+91[6-9][0-9]{9}$
  maxLength: 13
  examples:
    - "+919000000001"
OtpSendRequest:
  type: object
  additionalProperties: false
  required: [phone, purpose, app, turnstileToken]
  description: |
    `step_up` with `app: admin` is refused (422): an admin's step-up code goes to the admin's own number through
    `POST /v1/auth/step-up/send`, never to a number the caller names (D-264).
  not:
    required: [purpose, app]
    properties:
      purpose: {const: step_up}
      app: {const: admin}
  properties:
    phone:
      $ref: "#/IndianMobile"
    purpose:
      type: string
      description: |
        Why the code is sent. `login` signs in (`otp/verify`). `step_up` confirms a sensitive action of a
        signed-in customer, such as deleting the account (`DELETE /v1/me`); it never signs in. An admin's
        step-up is `POST /v1/auth/step-up/send` (D-264).
      enum: [login, step_up]
    app:
      $ref: "#/AuthApp"
    turnstileToken:
      type: string
      description: The Cloudflare Turnstile response token from the page. A failed check sends nothing (`403 forbidden`, AU-20).
      minLength: 1
      maxLength: 2048
OtpSendResponse:
  type: object
  description: |
    Identical for a known and an unknown number (AU-06). `requestId` names this code in
    `POST /v1/auth/otp/verify` (or, for an admin step-up, `POST /v1/auth/step-up/verify`).
  required: [requestId, resendAfter]
  properties:
    requestId:
      $ref: ./common.yaml#/Ulid
    resendAfter:
      type: integer
      minimum: 0
      description: Seconds until a code may be sent again to this number.
OtpVerifyRequest:
  type: object
  additionalProperties: false
  required: [requestId, code, app, deviceId]
  properties:
    requestId:
      $ref: ./common.yaml#/Ulid
    code:
      type: string
      description: The 6-digit code from the SMS. Never logged (D-15).
      pattern: ^[0-9]{6}$
      maxLength: 6
    app:
      $ref: "#/AuthApp"
    deviceId:
      type: string
      description: A ULID the app makes once per install and keeps; it names this device's session.
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      maxLength: 26
OtpVerifyResponse:
  type: object
  description: The access token and whether this sign-in created the account. The refresh token is only in the `Set-Cookie` header.
  required: [accessToken, tokenType, expiresAt, isNewUser, userId]
  properties:
    accessToken:
      type: string
      description: "The EdDSA access token (15 min). Keep it in memory only; send it as `Authorization: Bearer`."
    tokenType:
      type: string
      const: Bearer
    expiresAt:
      $ref: ./common.yaml#/Timestamp
    isNewUser:
      type: boolean
      description: True when this sign-in created the account.
    userId:
      $ref: ./common.yaml#/Ulid
AccessTokenResponse:
  type: object
  description: A fresh access token. The rotated refresh token is only in the `Set-Cookie` header.
  required: [accessToken, tokenType, expiresAt]
  properties:
    accessToken:
      type: string
      description: The EdDSA access token (15 min). Keep it in memory only.
    tokenType:
      type: string
      const: Bearer
    expiresAt:
      $ref: ./common.yaml#/Timestamp
AuthAppRequest:
  type: object
  description: Names the app whose refresh cookie the server reads; it reads no other (D-14).
  additionalProperties: false
  required: [app]
  properties:
    app:
      $ref: "#/AuthApp"
StepUpVerifyRequest:
  type: object
  additionalProperties: false
  required: [requestId, code]
  properties:
    requestId:
      $ref: ./common.yaml#/Ulid
    code:
      type: string
      description: The 6-digit code from the step-up SMS. Never logged (D-15).
      pattern: ^[0-9]{6}$
      maxLength: 6
StepUpVerifyResponse:
  type: object
  description: This sign-in may take † actions until `validUntil` (10 minutes, D-264).
  required: [validUntil]
  properties:
    validUntil:
      $ref: ./common.yaml#/Timestamp
