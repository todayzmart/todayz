# Schemas: domain "baskets" (owner W2-14; 01 §11.4, 03 baskets, D-110).
#
# A line is a master product or free text, never both: the contract keeps
# both optional and the handler answers 422 on `body.lines[i]` when a line
# has both or neither (the validator's oneOf messages would not name the
# field). Free text is stored normalised as search does (01 §11).
BasketLineInput:
  type: object
  additionalProperties: false
  required: [quantity]
  properties:
    productId:
      $ref: ./common.yaml#/Ulid
    text:
      type: string
      minLength: 1
      maxLength: 120
    quantity:
      type: integer
      minimum: 1
      maximum: 99
  oneOf:
    - required: [productId]
    - required: [text]
BasketCreate:
  type: object
  additionalProperties: false
  required: [name, lines]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
    lines:
      type: array
      description: At most `basket_max_items` lines (422 on `lines` beyond); 100 is the setting's maximum.
      maxItems: 100
      items:
        $ref: "#/BasketLineInput"
BasketSplitStore:
  type: object
  additionalProperties: false
  required: [storeId, storeSlug, storeName, lineIds]
  properties:
    storeId:
      $ref: ./common.yaml#/Ulid
    storeSlug:
      $ref: ./common.yaml#/Slug
    storeName:
      type: string
      minLength: 1
      maxLength: 120
    lineIds:
      type: array
      maxItems: 100
      items:
        $ref: ./common.yaml#/Ulid
BasketSplit:
  type: object
  additionalProperties: false
  description: >-
    The split the last basket search suggested (01 §11.4): the first store is the one "Fill cart"
    fills, the second the one "Next: the rest from {shop}" fills. Line ids are this basket's
    current lines; sending `lines` in the same PATCH is refused (the new lines get new ids).
  required: [stores, uncoveredLineIds, searchedAt]
  properties:
    stores:
      type: array
      minItems: 1
      maxItems: 2
      items:
        $ref: "#/BasketSplitStore"
    uncoveredLineIds:
      type: array
      maxItems: 100
      items:
        $ref: ./common.yaml#/Ulid
    searchedAt:
      $ref: ./common.yaml#/Timestamp
BasketPatch:
  type: object
  additionalProperties: false
  description: >-
    `lines`, when sent, replaces the whole set in one transaction and clears `lastSplit`.
    `lastSplit: null` clears the stored split.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
    lines:
      type: array
      maxItems: 100
      items:
        $ref: "#/BasketLineInput"
    lastSplit:
      oneOf:
        - $ref: "#/BasketSplit"
        - type: "null"
BasketLine:
  type: object
  required: [lineId, productId, productName, variant, packSize, unit, text, quantity, position]
  properties:
    lineId:
      $ref: ./common.yaml#/Ulid
    productId:
      oneOf:
        - $ref: ./common.yaml#/Ulid
        - type: "null"
    productName:
      type: [string, "null"]
      description: The master product's name for a product line, else null.
    variant:
      type: [string, "null"]
    packSize:
      type: [number, "null"]
      format: double
    unit:
      type: [string, "null"]
      description: The product's unit (g, kg, ml, l, pc, pack) for a product line, else null.
    text:
      type: [string, "null"]
      description: The normalised free text of a text line, else null.
    quantity:
      type: integer
      minimum: 1
      maximum: 99
    position:
      type: integer
      minimum: 0
Basket:
  type: object
  required: [basketId, name, lines, lastSplit, updatedAt, version]
  properties:
    basketId:
      $ref: ./common.yaml#/Ulid
    name:
      type: string
    lines:
      type: array
      items:
        $ref: "#/BasketLine"
    lastSplit:
      oneOf:
        - $ref: "#/BasketSplit"
        - type: "null"
    updatedAt:
      $ref: ./common.yaml#/Timestamp
    version:
      type: integer
      minimum: 1
BasketSummary:
  type: object
  required: [basketId, name, lineCount, updatedAt, version]
  properties:
    basketId:
      $ref: ./common.yaml#/Ulid
    name:
      type: string
    lineCount:
      type: integer
      minimum: 0
    updatedAt:
      $ref: ./common.yaml#/Timestamp
    version:
      type: integer
      minimum: 1
BasketList:
  type: object
  required: [baskets]
  properties:
    baskets:
      type: array
      items:
        $ref: "#/BasketSummary"
