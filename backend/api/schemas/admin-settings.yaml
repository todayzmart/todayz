# Schemas: domain "admin-settings" (owner W3-05): A-17 platform settings (04 §2.7, 01 §17).
# A value is a whole number (paise, bp, credits, minutes, hours, days, count, meters), a boolean (bool)
# or text (text). Settings never hold provider keys or secrets (D-19).
AdminSettingKey:
  type: string
  description: A 01 §17 key (D-61).
  minLength: 1
  maxLength: 64
  pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
AdminSettingUnit:
  type: string
  enum: [paise, bp, credits, minutes, hours, days, count, meters, bool, text]
AdminSettingGroup:
  type: string
  description: The 01 §17 section a key belongs to; `other` for a key no section claims yet.
  enum: [orders, stock, credits, reviews, referrals, pos, search, insights, field, jobs, asks, baskets, addresses, features, ai, clients, other]
AdminSettingValue:
  description: >-
    A whole number, a boolean or text (at most 200 characters), as the unit says. Untyped here because one
    schema cannot name three types for the generators; the server checks it against the unit.
AdminSetting:
  type: object
  additionalProperties: false
  required: [key, group, unit, value, min, max, description, money, editable, updatedBy, updatedByName, updatedAt, version]
  properties:
    key: {$ref: '#/AdminSettingKey'}
    group: {$ref: '#/AdminSettingGroup'}
    unit: {$ref: '#/AdminSettingUnit'}
    value: {$ref: '#/AdminSettingValue'}
    min:
      type: [integer, 'null']
      format: int64
    max:
      type: [integer, 'null']
      format: int64
    description: {type: string, maxLength: 500}
    money:
      type: boolean
      description: Unit paise, bp or credits; only super_admin changes it (D-64).
    editable:
      type: boolean
      description: Whether the caller's roles may change it (step-up is asked on save).
    updatedBy:
      type: [string, 'null']
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    updatedByName:
      type: [string, 'null']
      maxLength: 80
    updatedAt: {$ref: ./common.yaml#/Timestamp}
    version:
      type: integer
      minimum: 1
AdminSettingDetail:
  type: object
  additionalProperties: false
  required: [setting, serverNow]
  properties:
    setting: {$ref: '#/AdminSetting'}
    serverNow: {$ref: ./common.yaml#/ServerNow}
AdminProviderKey:
  type: object
  additionalProperties: false
  required: [name, set]
  properties:
    name:
      type: string
      description: The environment variable's name (D-19); never its value.
      maxLength: 64
      pattern: ^[A-Z][A-Z0-9_]{0,63}$
    set: {type: boolean}
AdminSettingList:
  type: object
  additionalProperties: false
  required: [items, providers, serverNow]
  properties:
    items:
      type: array
      maxItems: 500
      items: {$ref: '#/AdminSetting'}
    providers:
      type: array
      maxItems: 50
      items: {$ref: '#/AdminProviderKey'}
    serverNow: {$ref: ./common.yaml#/ServerNow}
AdminSettingChange:
  type: object
  additionalProperties: false
  required: [value, reason]
  properties:
    value: {$ref: '#/AdminSettingValue'}
    reason:
      type: string
      minLength: 1
      maxLength: 500
AdminSettingChangeEntry:
  type: object
  additionalProperties: false
  required: [id, actorId, actorName, from, to, reason, createdAt]
  properties:
    id: {$ref: ./common.yaml#/Ulid}
    actorId:
      type: [string, 'null']
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    actorName:
      type: [string, 'null']
      maxLength: 80
    from:
      description: The value before (as AdminSettingValue); null when the audit row did not record it.
    to:
      description: The value after (as AdminSettingValue); null when the audit row did not record it.
    reason:
      type: [string, 'null']
      maxLength: 500
    createdAt: {$ref: ./common.yaml#/Timestamp}
AdminSettingHistory:
  type: object
  additionalProperties: false
  required: [items, nextCursor, serverNow]
  properties:
    items:
      type: array
      maxItems: 100
      items: {$ref: '#/AdminSettingChangeEntry'}
    nextCursor: {$ref: ./common.yaml#/NextCursor}
    serverNow: {$ref: ./common.yaml#/ServerNow}
