# sqlc (02 §2.2): typed Go from SQL. `make gen` runs it; output in
# backend/gen/sqlc is generated and not committed.
#
# One entry per domain (D-50: a domain WP edits only its own lines and
# folder): queries in db/queries/<domain>/, generated into package
# <domain>db at gen/sqlc/<domain>db. The schema is the goose migrations (sqlc
# reads only the "+goose Up" part). River's tables come from a Go migration,
# so sqlc does not see them: use the River client, never SQL, for jobs.
#
# A nullable timestamptz is a *time.Time (nil for NULL), never a time.Time
# whose zero value would hide the NULL.
version: "2"
sql:
  # The first entry carries the shared settings (&pkg, &go); every other
  # entry merges them and sets only its queries, package and out.
  - &pkg
    engine: postgresql
    schema: migrations
    queries: queries/platform
    gen:
      go: &go
        package: platformdb
        out: ../gen/sqlc/platformdb
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/jackc/pgx/v5/pgtype.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
  - <<: *pkg
    queries: queries/identity
    gen:
      go:
        <<: *go
        package: identitydb
        out: ../gen/sqlc/identitydb
  - <<: *pkg
    queries: queries/business
    gen:
      go:
        <<: *go
        package: businessdb
        out: ../gen/sqlc/businessdb
  - <<: *pkg
    queries: queries/catalogue
