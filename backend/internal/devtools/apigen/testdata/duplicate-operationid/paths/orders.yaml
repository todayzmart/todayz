# Fixture: duplicate-operationid (getOrder renamed to listOrders).
/v1/me/orders:
  get:
    operationId: listOrders
    tags: [orders]
    summary: List my orders
    parameters:
      - $ref: ../common/parameters.yaml#/Limit
      - $ref: ../common/parameters.yaml#/Cursor
    responses:
      "200":
        description: A page
        content:
          application/json:
            schema:
              $ref: ../schemas/orders.yaml#/OrderList
            example:
              items:
                - id: 01JB0S1W6W8ZV7T1C3A6M9N4PQ
                  status: placed
                  totalPaise: 12000
              nextCursor: null
      default:
        $ref: ../common/responses.yaml#/Problem
  post:
