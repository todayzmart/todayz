# Fixture: the schemas valid-orders uses (and every fixture without its own).
OrderRequest:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: "#/OrderItem"
OrderItem:
  type: object
  additionalProperties: false
  required: [sku, quantity]
  properties:
    sku:
      type: string
      maxLength: 64
    quantity:
      type: integer
      minimum: 1
      maximum: 3
Order:
  type: object
  required: [id, status, totalPaise]
  properties:
    id:
      $ref: ./common.yaml#/Ulid
    status:
      type: string
      enum: [placed, accepted, rejected]
    totalPaise:
      $ref: ./common.yaml#/Paise
OrderList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items:
        $ref: "#/Order"
    nextCursor:
      $ref: ./common.yaml#/NextCursor
# Fixture: reason-outside-common (a reason enum outside schemas/common.yaml).
OrderCancelReason:
  type: string
  enum: [changed_mind, other]
