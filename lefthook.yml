# Git hooks (W0-01). Installed by `make setup`.
output:
  - failure
  - summary

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --config .gitleaks.toml --no-banner --redact
    forbidden-files:
      run: scripts/hooks/forbidden-files.sh {staged_files}

commit-msg:
  commands:
    docs-gate:
      run: scripts/hooks/docs-gate.sh {1}

pre-push:
  commands:
    no-push:
      run: scripts/hooks/no-push.sh
