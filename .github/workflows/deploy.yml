# Deploy the four Cloudflare Pages sites on every push to main (D-210, D-214): todayz.in,
# app., business. and admin.todayz.in. The API and worker deploy to Beanstalk from their own
# workflow once the AWS account is open.
#
# Two jobs so the secret never shares a job with third-party install code: `build` (no
# secrets) installs, generates and runs the production builds and uploads the output;
# `deploy` checks out only the script, downloads that output and uploads it with wrangler.
# scripts/ci/wflint/secrets-allow.txt lists the two secrets this file may read.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build Pages sites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go, Node, pnpm and CI tools
        uses: ./.github/actions/setup-toolchain

      # Only what the four builds need (see the script). The full `make setup` (Docker images,
      # map tiles, Terraform providers, the Python contract tools) is for ci.yml.
      - name: Install and generate the shared frontend code
        run: scripts/deploy/pages.sh prepare

      - name: Build the sites
        run: scripts/deploy/pages.sh build

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages
          path: .cache/pages
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages
          path: .cache/pages

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy/pages.sh deploy
