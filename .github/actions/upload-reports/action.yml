# Upload this run's reports as one artifact (W0-06 S3).
# scripts/ci/collect-reports.sh copies the paths listed in scripts/ci/paths.env into
# ci-reports/collected/ (hidden path parts renamed), and scanners write ci-reports/<name>/.
# The upload is ci-reports/ only: no repo-wide **/ globs, no include-hidden-files,
# no whole docs/qa tree.
name: Upload TodayZ CI reports
description: Collect the report paths from scripts/ci/paths.env into ci-reports/ and upload them.
inputs:
  name:
    description: Artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Collect reports
      shell: bash
      run: scripts/ci/collect-reports.sh

    - name: Upload ci-reports/
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ci-reports/
        if-no-files-found: ignore
        retention-days: 14
