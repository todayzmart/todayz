<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="tz-stack">
<div class="tz-row" style="padding:0">
<button class="tz-btn tz-btn-primary">Accept order</button>
<button class="tz-btn tz-btn-brand">Place order</button>
<button class="tz-btn"><svg class="tz-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Directions</button>
<button class="tz-btn tz-btn-ghost">View all</button>
<button class="tz-btn tz-btn-danger">Reject order</button>
<button class="tz-btn" disabled>Out of stock</button>
<button class="tz-btn tz-btn-icon" aria-label="Voice update"><svg class="tz-ico " viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</div>
<div class="tz-row" style="padding:0">
<button class="tz-btn tz-btn-primary tz-btn-lg">Save changes</button>
<button class="tz-btn tz-btn-brand tz-btn-lg">Charge ₹1,246</button>
<button class="tz-btn tz-btn-sm"><svg class="tz-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export CSV</button>
</div>
<div class="tz-row" style="padding:0">
<button class="tz-btn tz-btn-sm tz-btn-soft">Change</button>
<button class="tz-btn tz-btn-sm tz-btn-soft-danger">Remove</button>
<button class="tz-btn tz-btn-sm tz-btn-ghost">Cancel</button>
<button class="tz-btn tz-btn-sm tz-btn-icon" aria-label="More"><svg class="tz-ico " viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
<button class="tz-btn tz-btn-sm tz-btn-primary">Accept</button>
</div>
</div>
</body>
</html>
