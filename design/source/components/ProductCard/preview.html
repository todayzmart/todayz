<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProductCard — preview</title></head>
<body>
<div class="tz-grid2" style="padding:var(--space-4);max-width:400px">
<article class="tz-pcard">
<div class="tz-thumb">AT</div>
<div class="tz-pcard-name">Aashirvaad Shudh Chakki Atta</div>
<div class="tz-pcard-unit">5 kg</div>
<div><span class="tz-stock">In stock</span><div class="tz-fresh">updated 12 min ago</div></div>
<div class="tz-pcard-foot"><div><div class="tz-price">₹289</div><span class="tz-mrp">₹320</span> <span class="tz-off">10% off</span></div><div class="tz-stepper"><button aria-label="Remove one"><svg class="tz-ico tz-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span>1</span><button aria-label="Add one"><svg class="tz-ico tz-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
</article>
<article class="tz-pcard">
<div class="tz-thumb">AM</div>
<div class="tz-pcard-name">Amul Taaza Toned Milk</div>
<div class="tz-pcard-unit">500 ml</div>
<div><span class="tz-stock tz-stock-low">Only 3 left</span><div class="tz-fresh">updated 1 hr ago</div></div>
<div class="tz-pcard-foot"><div><div class="tz-price">₹28</div><span class="tz-mrp" style="text-decoration:none">&nbsp;</span></div><button class="tz-add">Add</button></div>
</article>
</div>
</body>
</html>
