# Schemathesis settings for run.sh (W0-04). Loaded with --config-file.

# Hypothesis' filter_too_much health check is about the generator, not the API: on
# nested bodies with many ULID patterns (offer previews: an OfferCreate plus up to
# 10 sample lines) the fuzzing phase sometimes discards too many drafts and the run
# errors with no failed check (CI e2e on f033f31). Schemathesis 4 only takes this
# globally; every check still runs on every example that is generated.
suppress-health-check = ["filter_too_much"]

# A list cursor is opaque: the coverage phase sends a schema-valid string the
# server never issued, and 422 validation_failed (query.cursor) is the right
# answer (W1-06, lead 2026-10-23). Lists behind auth answer 401 first, so only
# the public cursor lists are named here. A new public list with a cursor joins
# this list.
[[operations]]
include-operation-id = ["listDiscoverStores", "listDiscoverStoreItems", "searchDiscover", "listDiscoverStoreReviews"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# Basket search caps its lines at basket_max_items, a platform setting (01 §17,
# default 30, min 5, max 100). The contract can only carry the setting's
# maximum (maxItems: 100), so the coverage phase sends a schema-valid basket
# longer than today's setting, and 422 validation_failed (body.lines) is the
# right answer (W2-14). The saved-basket routes answer 401 first.
[[operations]]
include-operation-id = ["searchBasket"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# A referral link answers 302 to the app page (W2-03): the redirect is the
# success answer. hooks.py's before_call does not follow it, since the apps are
# not running under the smoke.
[[operations]]
include-operation-id = ["openReferralLink"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "302", "401", "403", "404", "409", "429", "5xx"]

# The lead form's free text (name, shopName, city) is checked past the contract's
# pattern: valid UTF-8 with no control characters (a C1 control like U+009D
# matches \S), since a lead lands in SMS and CSV exports. The fuzzing phase sends
# one, and 422 validation_failed on that field is the right answer (D-217).
[[operations]]
include-operation-id = ["createLead"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]
