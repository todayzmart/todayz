# Seed admins for local and test only (08 §2 Fixtures, D-64, Q-20; W1-01).
#
# TEST VALUES, NOT SECRETS. Read by the backend seed only through
# SEED_ADMINS_FILE (infra/local/local.env), which refuses unless APP_ENV is
# local or test; staging and prod never run the seed. The journeys
# (e2e/fixtures/api.ts adminTotpSecret) and admin/e2e/sign-in.stack.spec.ts read
# the same file and compute the code themselves; the mocks have no TOTP panel.
# Never copy these into docs or logs.
#
# One enrolled admin per D-64 role, two each of finance and super_admin (the
# two-person approval tests), and admin.unenrolled with no totp_secret, so A-01
# first-login enrolment can be tested. Phones are the reserved test range
# (+91 90000 000xx: OTP 000000 in local and test). An id is a ULID whose 23rd
# character is N (the seed derives the phone identity id from it).
#
# totp_secret is base32 (RFC 6238, SHA-1, 6 digits, 30 s): the first 20 bytes
# of SHA-256("todayz-seed-admin-totp:" + key), so the file can be rebuilt.
