# Seed admins for local and test only (08 §2 Fixtures, D-64, Q-20; W1-01).
#
# TEST PEOPLE, NOT SECRETS. Read by the backend seed only through
# SEED_ADMINS_FILE (infra/local/local.env), which refuses unless APP_ENV is
# local or test; staging and prod never run the seed. Admins sign in with the
# SMS OTP alone and confirm a † action with an SMS step-up (D-264): the
# journeys and admin/e2e read the codes from the mocks server, like any
# sign-in.
#
# One admin per D-64 role, two each of finance and super_admin (the
# two-person approval tests), and admin.unenrolled, a support admin who has
# never signed in (the first-sign-in tests). Phones are the reserved test range
# (+91 90000 000xx: OTP 000000 in local and test). An id is a ULID whose 23rd
# character is N (the seed derives the phone identity id from it).
