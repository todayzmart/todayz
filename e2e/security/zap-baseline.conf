# ZAP baseline rule triage (W0-06 S5). Format: <rule id><TAB><IGNORE|WARN|FAIL><TAB>(name).
# Read by scripts/ci/scan.sh zap (zap-baseline.py -c). Rules not listed keep ZAP defaults (WARN).
# Triage is from the W0-06 baseline runs; every WARN below has an owner who turns it into FAIL
# once the fix lands. Change a line only with a reason in the comment above it.
#
# Security headers: set once in Caddy (infra/local/Caddyfile) and the Cloudflare edge (Wave 5).
# Owner: infra. WARN until the header block lands, then FAIL.
10020	WARN	(Missing Anti-clickjacking Header)
10021	WARN	(X-Content-Type-Options Header Missing)
10038	WARN	(Content Security Policy (CSP) Header Not Set)
10063	WARN	(Permissions Policy Header Not Set)
90004	WARN	(Cross-Origin-Embedder-Policy Header Missing or Invalid)
10035	WARN	(Strict-Transport-Security Header Not Set)
# Version leak: Caddy sends "Server: Caddy" with no version and Vite sends none, so a hit is a regression.
10036	FAIL	(Server Leaks Version Information via "Server" HTTP Response Header Field)
# Hashed static assets (Vite/Astro build output) are meant to be cacheable. API responses carry
# Cache-Control: no-store (W0-03); 10049 stays informational.
10049	IGNORE	(Storable and Cacheable Content)
10055	WARN	(CSP: Wildcard Directive / unsafe-inline; reviewed with the CSP above)
# Information disclosure that must never appear.
10023	FAIL	(Information Disclosure - Debug Error Messages)
10024	FAIL	(Information Disclosure - Sensitive Information in URL)
10027	WARN	(Information Disclosure - Suspicious Comments; dev builds keep comments)
10096	WARN	(Timestamp Disclosure - Unix)
10098	WARN	(Cross-Domain Misconfiguration)
